<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>고양이 해변섬</title>
<meta name="theme-color" content="#1c90b8">
<!-- 홈 화면 앱 (아이폰 Safari '홈 화면에 추가' / 안드로이드 크롬 '앱 설치') -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="고양이 해변섬">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{--cream:#fbf1dc;--cream2:#f3e3c3;--brown:#7a5236;--brown2:#a8774f;--ink:#5a3d2b;--green:#6fae5b;--green2:#4f8f40;--orange:#ef8a4a;--orange2:#d26a2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#15708f}
body{font:13px/1.35 'Galmuri11','Galmuri9',"Malgun Gothic",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse at 50% 50%,#1a83a6,#125f7a)}
/* 게임 창 = 배경 그림(정사각형)에 딱 맞는 크기 */
#game{position:fixed;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.12),0 10px 40px rgba(0,30,50,.45)}
canvas#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#dock{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.ibtn.big{width:76px;height:72px;font-size:11px;position:relative}
.badge{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--orange);color:#fff;border:2px solid #fff;font:11px/18px 'Galmuri11',sans-serif;font-style:normal;padding:0 5px}
.badge[hidden]{display:none}
.cgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.cgrid2 .card{flex:none}
.px{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle}
.panel{background:var(--cream);border:3px solid var(--brown);border-radius:14px;box-shadow:0 4px 0 rgba(90,55,30,.35),inset 0 0 0 2px #fff7e8}
button{font:inherit;color:inherit;cursor:pointer}
/* 위쪽: 로고 · 자원 · 도감/설정 */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));pointer-events:none}
#hud>*{pointer-events:auto}
#logo{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 6px;border-radius:999px;background:rgba(251,241,220,.92);border:3px solid var(--brown);box-shadow:0 3px 0 rgba(90,55,30,.35)}
#logo canvas{width:42px;height:42px}
#logo b{font-size:18px;line-height:1;color:var(--brown);letter-spacing:1px;text-shadow:2px 2px 0 #fff}
#res{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:1}
.chip{display:flex;align-items:center;gap:8px;min-width:86px;padding:5px 14px 5px 8px;border-radius:12px;background:var(--cream);border:3px solid var(--brown);box-shadow:0 3px 0 rgba(90,55,30,.35);font-size:17px;justify-content:space-between}
.chip.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.15)}}
.ibtn{width:62px;height:62px;border-radius:14px;background:var(--cream);border:3px solid var(--brown);box-shadow:0 3px 0 rgba(90,55,30,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;padding:0}
.ibtn:active,.chip:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(90,55,30,.35)}
/* 튜토리얼 · 퀘스트 */
#goals{position:absolute;left:12px;top:78px;width:240px;padding:9px 12px 11px}
.qh{display:flex;justify-content:space-between;align-items:center}
.qtag{background:linear-gradient(#f8ad78,#ef8a4a);color:#fff;border:2px solid #b8602a;border-radius:9px;padding:1px 8px;font-size:11px;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.qr{display:flex;align-items:center;gap:3px;font-size:12px;color:#b77a10}
.qt{font-size:14px;margin:6px 0 2px}
.qhint{font-size:11px;color:#9a7a60;margin-bottom:2px}
.qbar{position:relative;height:16px;margin-top:6px;border-radius:9px;background:#ead9bb;border:2px solid var(--brown2);overflow:hidden}
.qbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#b4e69a,#6fae5b);transition:width .3s}
.qbar span{position:relative;display:block;text-align:center;font-size:10px;line-height:12px}
.qclaim{width:100%;margin-top:8px;animation:wiggle 1.2s infinite}
@keyframes wiggle{0%,100%{transform:none}10%{transform:rotate(-2deg) scale(1.03)}20%{transform:rotate(2deg) scale(1.03)}30%{transform:none}}
/* 튜토리얼이 가리키는 버튼 반짝반짝 */
.ibtn.hint{animation:hint 1s infinite;border-color:#e0a020}
@keyframes hint{50%{transform:translateY(-4px);box-shadow:0 0 0 4px #fff3a0,0 0 18px 6px #ffd84a}}
/* 제작 · 업그레이드 창 안 */
.card{display:flex;gap:8px;padding:10px;border-radius:14px;background:#fffaf0;border:3px solid #e3c9a0;box-shadow:0 4px 0 #e3c9a0}
.card .ic{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:#f6e6c8;border:2px solid #e3c9a0;border-radius:10px;padding:6px 0 4px;font-size:11px}
.card .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card b{font-weight:400;font-size:13px;white-space:nowrap}
.need{display:flex;gap:8px;font-size:11px;flex-wrap:wrap}
.need span{display:flex;align-items:center;gap:2px}
.need .lack{color:#d0503a}
.card.locked{opacity:.55;filter:grayscale(.6)}
/* 볼록한 3D 버튼 */
.btn{border:3px solid #3f7a33;background:linear-gradient(#8ccb73,#6fae5b);color:#fff;border-radius:12px;padding:7px 10px;font-size:12px;box-shadow:0 4px 0 #3f7a33,inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 1px 0 rgba(0,0,0,.25);position:relative;overflow:hidden;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3f7a33}
.btn.or{background:linear-gradient(#f8ad78,#ef8a4a);border-color:#b8602a;box-shadow:0 4px 0 #b8602a,inset 0 2px 0 rgba(255,255,255,.45)}
/* 돈·재료가 부족하면 회색 (누를 수 없음) */
.btn[disabled],.btn.or[disabled]{background:linear-gradient(#ddd5c6,#cbc1b0);border-color:#a8977a;box-shadow:0 4px 0 #a8977a;color:#f8f4ec;text-shadow:none;cursor:default;transform:none}
.btn .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.35)}
.stock{font-size:11px;color:#8a6a50}
#upgList{display:flex;flex-direction:column;gap:8px}
.urow{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fffaf0;border:3px solid #e3c9a0;border-radius:14px;box-shadow:0 4px 0 #e3c9a0}
.urow .tx{flex:1;min-width:0;font-size:12px}
.urow .tx small{display:block;color:#9a7a60;font-size:10px}
/* 창 */
#modal{position:fixed;inset:0;background:rgba(30,60,80,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal[hidden]{display:none}
.dlg{position:relative;width:560px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;padding:38px 16px 16px;margin-top:20px;animation:pop .2s cubic-bezier(.3,1.4,.6,1)}
#modal .dlg.panel{border:6px solid #7a5236;border-radius:24px;background:#fbf1dc;box-shadow:0 8px 0 #5a3a22,0 16px 34px rgba(0,30,50,.35),inset 0 0 0 4px #fff7e8,inset 0 -10px 0 rgba(168,119,79,.14)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
/* 제목: 위에 걸린 나무 간판 */
.dlg h3{position:absolute;left:50%;top:-24px;transform:translateX(-50%);margin:0;white-space:nowrap;font-size:16px;font-weight:400;display:flex;align-items:center;gap:8px;padding:7px 22px 6px;color:#fff7e8;background:linear-gradient(#cf9662,#a8774f);border:4px solid #7a5236;border-radius:14px;box-shadow:0 4px 0 #5a3a22,inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 2px 0 #7a5236}
.dlg h3 img{filter:drop-shadow(0 1px 0 #7a5236)}
/* 닫기: 연노랑 둥근 상자 */
.dlg .x{position:absolute;right:-16px;top:-16px;z-index:2;width:38px;height:38px;padding:0;background:linear-gradient(#fff8c4,#ffe98a);border:4px solid #7a5236;border-radius:12px;box-shadow:0 4px 0 #5a3a22,inset 0 2px 0 #fff;font:bold 18px/26px sans-serif;color:#7a5236}
.dlg .x:active{transform:translateY(3px);box-shadow:0 1px 0 #5a3a22}
.dlg .in{overflow-y:auto}
.dex{padding:10px 8px 4px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.dexc{background:#fffaf0;border:3px solid #e3c9a0;box-shadow:0 4px 0 #e3c9a0;border-radius:14px;padding:6px;text-align:center;font-size:12px}
.dexc canvas{width:100%;height:auto;display:block}
.dexc.no canvas{filter:brightness(0) opacity(.25)}
.dexc small{display:block;color:#9a7a60;font-size:10px;min-height:26px}
/* 오프닝 타이틀: 위에서 툭 떨어짐 → 양옆 구름 펑 → 사라짐 */
#game.opening #hud{display:none}
#opening{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .6s}
#opening[hidden]{display:none}
#opening.bye{opacity:0}
#opening.bye .otitle{transform:scale(.9) translateY(-20px);transition:transform .6s}
.otitle{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:-8vh;animation:odrop .9s cubic-bezier(.35,1.6,.5,1) both}
@keyframes odrop{0%{transform:translateY(-110vh)}70%{transform:translateY(0) scaleY(.92) scaleX(1.05)}100%{transform:none}}
.ocat{width:clamp(80px,14vw,130px);height:auto;filter:drop-shadow(0 4px 0 #7a5236) drop-shadow(0 0 10px #fff)}
.otitle b{--o:clamp(3px,.55vw,6px);font-weight:400;font-size:clamp(42px,9vw,96px);line-height:1.15;color:#fff7e8;letter-spacing:2px;white-space:nowrap;
text-shadow:var(--o) 0 0 #7a5236,calc(var(--o)*-1) 0 0 #7a5236,0 var(--o) 0 #7a5236,0 calc(var(--o)*-1) 0 #7a5236,var(--o) var(--o) 0 #7a5236,calc(var(--o)*-1) var(--o) 0 #7a5236,var(--o) calc(var(--o)*-1) 0 #7a5236,calc(var(--o)*-1) calc(var(--o)*-1) 0 #7a5236,0 calc(var(--o)*2.2) 0 #5a3a22,var(--o) calc(var(--o)*2.2) 0 #5a3a22,calc(var(--o)*-1) calc(var(--o)*2.2) 0 #5a3a22}
.otitle small{margin-top:6px;font-size:clamp(13px,2vw,20px);color:#fff;text-shadow:0 2px 0 #7a5236,0 0 8px #3a8fb0}
.otap{position:absolute;bottom:12vh;margin:0;color:#fff;font-size:15px;text-shadow:0 2px 0 #3a7f9c;animation:blink 1.4s 1.6s infinite both}
@keyframes blink{0%,100%{opacity:0}50%{opacity:1}}
/* 구름: 하얀 동그라미 뭉치 */
.cl{position:absolute;top:58%;width:clamp(90px,14vw,170px);height:clamp(30px,4.4vw,52px);border-radius:999px;background:#fff;opacity:0;filter:drop-shadow(0 5px 0 rgba(110,170,205,.45));animation:puff 2.2s ease-out both}
.cl::before,.cl::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cl::before{width:48%;aspect-ratio:1;left:14%;bottom:30%}
.cl::after{width:36%;aspect-ratio:1;right:14%;bottom:38%}
.cl.l1{right:100%;top:62%;--dx:-40px;animation-delay:.78s}.cl.l2{right:88%;top:8%;--dx:-70px;animation-delay:.92s}
.cl.r1{left:100%;top:62%;--dx:40px;animation-delay:.78s}.cl.r2{left:88%;top:8%;--dx:70px;animation-delay:.92s}
@keyframes puff{0%{opacity:0;transform:translateX(0) scale(.3)}18%{opacity:1;transform:translateX(var(--dx)) scale(1)}70%{opacity:.95;transform:translateX(calc(var(--dx)*1.5)) scale(1.08)}100%{opacity:0;transform:translateX(calc(var(--dx)*2.3)) scale(1.25)}}
/* 처음 이야기: 왼쪽 아래 큰 초상화 + 아래 대사창 (이때는 퀘스트·제작 버튼을 숨김) */
#game.storymode #dock,#game.storymode #goals{display:none}
#story{position:fixed;inset:0;z-index:40;pointer-events:none}
#story[hidden]{display:none}
/* 초상화는 대사창 바로 위에 서 있게 (대사창 높이 --bh는 JS가 재서 넣음), 위쪽 자원창은 피함 */
#story .pt{position:absolute;left:max(0px,calc(50vw - 520px));bottom:calc(var(--bh,170px) - 14px);height:min(52vh,520px,calc(100vh - var(--bh,170px) - 110px));width:auto;max-width:80vw;object-fit:contain;filter:drop-shadow(0 0 8px rgba(255,255,255,.95)) drop-shadow(0 0 3px #fff);animation:ptIn .5s cubic-bezier(.3,1.3,.6,1)}
@keyframes ptIn{from{transform:translateX(-60px);opacity:0}}
#story .sbox{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:980px;margin:0 auto;min-height:150px;padding:24px 20px 16px;pointer-events:auto;cursor:pointer;border-width:5px;border-radius:20px;box-shadow:0 6px 0 #5a3a22,inset 0 0 0 3px #fff7e8;animation:boxIn .35s}
@keyframes boxIn{from{transform:translateY(40px);opacity:0}}
#story .nm{position:absolute;left:22px;top:-20px;padding:5px 18px;font-size:15px;color:#fff7e8;background:linear-gradient(#cf9662,#a8774f);border:4px solid #7a5236;border-radius:12px;box-shadow:0 3px 0 #5a3a22;text-shadow:0 2px 0 #7a5236}
#story .txt{margin:0 0 12px;font-size:17px;line-height:1.65;min-height:56px}
#story .btn{float:right;font-size:14px;padding:9px 18px}
#story.out{opacity:0;transition:opacity .35s}
@media (max-width:600px){#story .pt{left:-6px;height:min(40vh,calc(66vw * 1.29),calc(100vh - var(--bh,170px) - 110px))}#story .sbox{min-height:140px;padding:22px 14px 12px}#story .txt{font-size:15px}}
/* 퀘스트 창 접기/펼치기 */
.qmin{margin-left:6px;width:22px;height:20px;padding:0;border:2px solid var(--brown2);border-radius:7px;background:#fff8e6;color:var(--brown);font-size:11px;line-height:14px}
#goals.folded{width:auto;padding:0;background:none;border:0;box-shadow:none}
#game.port #goals.folded{right:auto}
.qfold{position:relative;display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:13px;color:var(--ink);background:var(--cream);border:3px solid var(--brown);border-radius:12px;box-shadow:0 3px 0 rgba(90,55,30,.35)}
.qfold .qarr{font-size:11px;color:var(--brown2)}
.qdot{position:absolute;right:-8px;top:-9px;width:20px;height:20px;border-radius:50%;background:#ef6a4a;color:#fff;border:2px solid #fff;font:bold 12px/16px sans-serif;text-align:center;animation:bump .6s infinite alternate}
/* 피크 타임: 코인 칸에 불꽃 + 테두리·글씨 반짝반짝 */
.chip{position:relative}
.chip .fire{display:none;font-style:normal;font-size:18px;line-height:1}
.chip.peak{border-color:#ff9a1f;animation:peakglow .7s ease-in-out infinite alternate;overflow:visible}
.chip.peak .fire{display:inline-block;animation:flick .35s infinite alternate}
.chip.peak span{color:#e0521a;text-shadow:0 0 6px #ffe066,0 0 12px #ffb347;animation:peaktext .7s infinite alternate}
.chip.peak::after{content:'';position:absolute;inset:-3px;border-radius:14px;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:250% 100%;animation:shine 1.2s linear infinite;pointer-events:none}
@keyframes peakglow{from{box-shadow:0 3px 0 rgba(90,55,30,.35),0 0 6px 2px #ffd84a}to{box-shadow:0 3px 0 rgba(90,55,30,.35),0 0 16px 6px #ff9a1f}}
@keyframes peaktext{to{transform:scale(1.08)}}
@keyframes flick{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(8deg) scale(1.2)}}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
.chip .ptime{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;white-space:nowrap;font-style:normal;font-size:11px;color:#fff;background:#e0521a;border:2px solid #fff;border-radius:8px;padding:0 6px}
.chip .ptime:empty{display:none}
/* 튜토리얼 안내 화살표 (통통 튀면서 가리킴) */
#coach{position:fixed;z-index:70;pointer-events:none;display:flex;flex-direction:column;align-items:center;transition:left .25s,top .25s}
#coach[hidden]{display:none}
#coach svg{filter:drop-shadow(0 0 1.5px rgba(122,82,54,.7)) drop-shadow(0 2px 3px rgba(90,60,30,.35));animation:cbounce .8s ease-in-out infinite}
#coach.up svg{transform:rotate(180deg);animation-name:cbounceUp}
#coach .ctxt{order:-1} /* 아래를 가리킬 땐 설명 → 화살표 → 버튼 순 */
#coach.up .ctxt{order:1} /* 위를 가리킬 땐 대상 → 화살표 → 설명 순 */
@keyframes cbounce{0%,100%{transform:translateY(-6px)}50%{transform:translateY(5px)}}
@keyframes cbounceUp{0%,100%{transform:rotate(180deg) translateY(-6px)}50%{transform:rotate(180deg) translateY(5px)}}
#coach .ctxt{margin:4px 0;max-width:220px;text-align:center;font-size:12px;line-height:1.45;color:var(--ink);background:rgba(255,250,238,.95);border:2px solid #e3c9a0;border-radius:10px;padding:5px 10px;box-shadow:0 2px 0 rgba(90,55,30,.2);white-space:normal}
/* 제작 창 위로 띄운 주문 대기열 (튜토리얼 안내용) */
#ordersLift{position:fixed;z-index:65;display:flex;align-items:flex-start;gap:8px;pointer-events:none;filter:drop-shadow(0 0 10px rgba(255,240,180,.95));animation:pop .25s}
#ordersLift .otag{align-self:center;font-size:13px;color:#fff;background:var(--brown);border-radius:9px;padding:4px 9px;box-shadow:0 2px 0 #5a3a22}
/* 손님 주문 대기열 (타이쿤처럼 화면 위쪽 가운데) */
#orders{position:absolute;left:50%;top:72px;transform:translateX(-50%);display:flex;align-items:flex-start;gap:8px;pointer-events:none;z-index:3}
#orders:empty{display:none}
#orders .otag{align-self:center;font-size:13px;color:#fff;background:var(--brown);border-radius:9px;padding:4px 9px;box-shadow:0 2px 0 #5a3a22}
.ord{position:relative;display:flex;align-items:center;gap:6px;padding:4px 10px 10px 4px;background:var(--cream);border:3px solid var(--brown);border-radius:14px;box-shadow:0 3px 0 rgba(90,55,30,.35);animation:pop .25s}
.ord .face{width:46px;height:46px;border-radius:10px;object-fit:cover;object-position:50% 20%;background:#f6e6c8}
.ord img.px{width:34px!important;height:34px!important}
.ord .bar{position:absolute;left:7px;right:7px;bottom:3px;height:5px;border-radius:3px;background:#e4d6bd;overflow:hidden}
.ord .bar i{display:block;height:100%;transition:width .2s}
.ord .ok{position:absolute;right:-7px;top:-8px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;border:2px solid #fff;font:bold 11px/14px sans-serif;text-align:center}
.ord.come{opacity:.55}
.ord.come .bar{display:none}
.ord.hurry{animation:hurry .5s infinite alternate}
@keyframes hurry{to{border-color:#ef6a4a}}
#game.port #orders{top:122px;gap:5px;max-width:calc(100% - 16px)}
#game.port .ord{gap:3px;padding:3px 6px 9px 3px}
#game.port .ord .face{width:36px;height:36px}
#game.port .ord img.px{width:26px!important;height:26px!important}
#game.port #orders .otag{font-size:11px;padding:3px 6px}
/* 주문 대기열 접기/펼치기 (위쪽 자원 칸 바로 아래에 붙음 — 위치는 JS가 맞춤) */
#orders .otag,.ofold{pointer-events:auto;white-space:nowrap;cursor:pointer;border:0;font:inherit}
.ofold{display:flex;align-items:center;gap:6px;padding:5px 12px;font-size:13px;color:var(--ink);background:var(--cream);border:3px solid var(--brown);border-radius:12px;box-shadow:0 3px 0 rgba(90,55,30,.35)}
.ofold i{font-style:normal;font-size:11px;color:var(--brown2)}
/* 폰: 창을 살짝 비치게 */
#game.port #goals.panel:not(.folded),#game.small #goals.panel:not(.folded){background:rgba(251,241,220,.84)}
#game.port .ord,#game.small .ord{background:rgba(251,241,220,.88)}
#game.port #dock .ibtn,#game.small #dock .ibtn{background:rgba(251,241,220,.9)}
/* 화면 정리 버튼: 퀘스트·주문 창을 한 번에 숨김 (폰) */
#uiTog{display:none;flex:none;width:38px;padding:0;border-radius:12px;background:var(--cream);border:3px solid var(--brown);box-shadow:0 3px 0 rgba(90,55,30,.35);font-size:15px;line-height:1}
#game.port #uiTog,#game.small #uiTog{display:block}
#game.small #uiTog{width:30px;border-width:2px}
#game.clean #uiTog{background:#ffe98a}
#game.clean #goals,#game.clean #orders{display:none}
#game.clean #dock{opacity:.75}
#game.small #orders{top:84px;gap:4px}
#game.small .ord .face{width:32px;height:32px}
#game.small .ord img.px{width:24px!important;height:24px!important}
/* 업그레이드 가능: 금빛으로 반짝 + 별 */
.ibtn.canup{border-color:#e0a020;animation:canup 1.1s ease-in-out infinite}
.ibtn.canup::after{content:'✦';position:absolute;right:4px;top:2px;font-size:14px;color:#ffc93c;text-shadow:0 0 6px #fff;animation:twinkle 1.1s infinite}
@keyframes canup{50%{box-shadow:0 3px 0 rgba(90,55,30,.35),0 0 0 3px #fff3a0,0 0 18px 6px #ffd84a}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
.urow{position:relative}
.urow.reco{border-color:#f6c343;box-shadow:0 4px 0 #e0a020,0 0 0 2px #fff3a0}
.recot{position:absolute;left:-6px;top:-10px;font-style:normal;font-size:10px;color:#fff;background:#ef8a4a;border:2px solid #fff;border-radius:8px;padding:0 6px;transform:rotate(-6deg)}
/* 고양이 특별 주문 */
.cq{margin:-2px 0 8px;padding:7px 9px;border-radius:12px;background:#fff1dc;border:2px dashed #ef8a4a}
.cqh{font-size:12px;color:#d2541c}
.cqt{font-size:13px;margin:3px 0;display:flex;align-items:center;gap:4px}
.cq .btn{width:100%;margin-top:6px;padding:5px}
.cqs{display:block;margin-top:4px;color:#9a7a60}
.card.special{border-color:#ef8a4a;box-shadow:0 4px 0 #ef8a4a;background:#fff4e6;grid-column:1/-1}
.card.spl{align-items:center;text-align:left;font-size:12px;cursor:pointer;width:100%}
.card.spl span{flex:1}.card.spl b{font-weight:400;color:#d2541c}.card.spl small{color:#9a7a60}.card.spl em{font-style:normal;color:#d2541c;white-space:nowrap}
.spfinal{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px;border-radius:14px;background:#fff4e6;border:3px dashed #ef8a4a}
.spfinal b{flex:1;font-weight:400}
.unl-card.gift{background:linear-gradient(#fff8c4,#ffe98a)}
/* 알바 · 가게 정보 */
.hinfo{font-size:12px;color:#8a6a50;background:#fff7e8;border-radius:10px;padding:8px 10px;margin-bottom:10px;line-height:1.5}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:8px;background:#fffaf0;border:3px solid #e3c9a0;border-radius:14px;box-shadow:0 4px 0 #e3c9a0}
.hrow .tx{flex:1;min-width:0}.hrow .tx b{font-weight:400}.hrow small{color:#9a7a60;font-size:11px}
.aff{position:relative;height:13px;margin-top:4px;border-radius:7px;background:#f3e0e6;border:2px solid #e9a8bb;overflow:hidden}
.aff i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffb3c8,#f08aa6)}
.aff span{position:relative;display:block;text-align:center;font-size:9px;line-height:9px;color:#8a4a5c}
.dexc .reg{font-style:normal;font-size:10px;color:#e0521a}
.dexc .pay{min-height:0!important;margin-top:2px}
.sinfo h4{margin:14px 0 6px;font-size:13px;font-weight:400;color:var(--brown);border-bottom:2px dashed var(--cream2);padding-bottom:3px}
.srow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:12px}.srow span{color:#9a7a60}.srow b{font-weight:400;text-align:right}
.irow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}.irow b{font-weight:400;display:block}.irow small{color:#9a7a60;font-size:11px}
.sinfo .none{margin:2px 0;font-size:11px;color:#9a7a60;line-height:1.5}
/* 새로 해금된 도감 카드: 뒷면(???) → 뒤집기 → 반짝 */
.dexc.new{position:relative;border-color:#f6c343;box-shadow:0 4px 0 #e0a020,0 0 0 3px #fff3a0;perspective:600px}
.dexc.new .fl{position:relative;transform-style:preserve-3d;transform:rotateY(180deg);transition:transform .9s cubic-bezier(.3,1.35,.6,1)}
.dexc.new.go .fl{transform:rotateY(0)}
.ff,.fb{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fb{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(#cf9662,#a8774f);border-radius:10px;color:#fff7e8}
.fb i{font-style:normal;font-size:46px;line-height:1;text-shadow:0 3px 0 #7a5236}
.fb small{color:#fff3d8!important}
.dexc.new.go{animation:glowc 1.3s .9s infinite}
@keyframes glowc{50%{box-shadow:0 4px 0 #e0a020,0 0 0 4px #fff3a0,0 0 24px 9px #ffd84a;transform:scale(1.04)}}
.newtag{position:absolute;top:-10px;right:-8px;z-index:2;background:#ef6a4a;color:#fff;font-style:normal;font-size:10px;padding:2px 7px;border-radius:8px;border:2px solid #fff;transform:rotate(8deg);opacity:0;transition:opacity .3s .9s}
.dexc.new.go .newtag{opacity:1}
/* '도감이 해금되었습니다!' 창 */
.unl{position:relative;text-align:center;padding:8px 0 4px;overflow:hidden}
.unl-rays{position:absolute;left:50%;top:80px;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:repeating-conic-gradient(rgba(255,216,74,.4) 0 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.unl-card{position:relative;width:110px;height:140px;margin:6px auto 14px;border-radius:14px;background:linear-gradient(#cf9662,#a8774f);border:4px solid #7a5236;box-shadow:0 5px 0 #5a3a22,inset 0 2px 0 rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;animation:bob 1.2s ease-in-out infinite}
.unl-card b{font-size:58px;font-weight:400;color:#fff7e8;text-shadow:0 3px 0 #7a5236}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.unl p{position:relative;margin:0 0 14px;font-size:14px}
.unl p b{font-weight:400;color:var(--orange2)}
.unl .btn{position:relative}
.drow{display:flex;align-items:center;gap:10px;padding:10px;background:#fffaf0;border:3px solid #e3c9a0;box-shadow:0 4px 0 #e3c9a0;border-radius:14px;margin-bottom:10px}
.drow .tx{flex:1}
.drow .tx small{display:block;color:#9a7a60;font-size:11px}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:2px dashed var(--cream2)}
.row:first-child{border-top:0}
.tog{width:48px;height:26px;border-radius:13px;border:2px solid var(--brown2);background:#e4d6bd;position:relative;padding:0}
.tog::after{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--green)}.tog.on::after{left:24px}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;z-index:60;font-size:13px;max-width:92vw;animation:pop .2s}
#toast[hidden]{display:none}
#toast canvas{width:46px;height:40px}
.talk{display:flex;gap:12px;align-items:flex-end}
.talk canvas{width:150px;flex:none}
.dlg.notitle{padding-top:18px}
.ptw{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.ptn{font-weight:400;font-size:15px;color:#fff7e8;background:linear-gradient(#cf9662,#a8774f);border:3px solid #7a5236;border-radius:10px;padding:3px 16px;box-shadow:0 3px 0 #5a3a22;text-shadow:0 2px 0 #7a5236}
.talk .bub{flex:1;background:#fff7e8;border:2px solid var(--cream2);border-radius:12px;padding:12px;font-size:14px;line-height:1.6}
/* 게임 창이 작을 때(폰 등) */
#game.small #hud{flex-wrap:wrap;gap:5px;padding:6px}
#game.small #logo{display:none}
#game.small #res{order:2;width:100%;flex:none;gap:4px}
#game.small .chip{min-width:0;flex:1;padding:3px 6px 3px 4px;font-size:12px;gap:3px;border-width:2px}
#game.small .chip img{width:18px!important;height:18px!important}
#game.small .ibtn{width:40px;height:40px;font-size:8px;border-width:2px}
#game.small .ibtn canvas{width:20px!important;height:20px!important}
#game.small .ibtn.big{width:52px;height:50px}
#game.small #dock{right:6px;bottom:6px;gap:4px}
#game.small #goals{top:auto;bottom:62px;left:6px;width:190px;padding:5px 8px 7px}
#game.small .qt{font-size:12px;margin-top:3px}
#game.small .qhint{display:none}
#game.small #hud .sp{flex:1}
/* 세로 화면(폰): 섬이 화면을 꽉 채우고, 위에 자원 · 아래에 퀘스트 + 큰 버튼을 겹쳐 올림 */
#game.port #hud{flex-wrap:wrap;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top))}
#game.port #logo{padding:2px 12px 2px 4px}
#game.port #logo canvas{width:34px;height:34px}
#game.port #logo b{font-size:14px}
#game.port .sp{order:1;flex:1}
#game.port #hud .ibtn{order:2;width:52px;height:50px;font-size:10px}
#game.port #hud .ibtn canvas{width:24px!important;height:24px!important}
#game.port #res{order:3;width:100%;flex:none;gap:6px;flex-wrap:nowrap}
#game.port .chip{min-width:0;flex:1;padding:4px 8px 4px 5px;font-size:15px;gap:4px}
#game.port .chip img{width:22px!important;height:22px!important}
#game.port #goals{top:auto;bottom:calc(92px + env(safe-area-inset-bottom));left:10px;right:10px;width:auto}
#game.port #dock{right:10px;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));gap:10px}
#game.port #dock .ibtn.big{flex:1;width:auto;height:70px;font-size:13px}
/* 폰에서 창 안 버튼을 크게 */
@media (max-width:600px){
.dlg{padding:34px 12px 14px}
.dlg .x{right:-12px;top:-14px}
.btn{padding:10px 12px;font-size:13px}
.cgrid2{grid-template-columns:1fr}
.urow,.drow{padding:10px}
.dex{grid-template-columns:repeat(3,1fr)}
.tog{width:56px;height:30px}.tog::after{width:22px;height:22px}.tog.on::after{left:28px}
}
/* ===== 고양이 섬의 소문 ===== */
#hud .ibtn{position:relative}
.rlist .rty{margin:12px 0 6px;font-size:13px;color:var(--brown)}
.rlist .rty:first-child{margin-top:2px}
.rrow{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;margin-bottom:8px;background:#fffaf0;border:3px solid #e3c9a0;border-radius:14px;box-shadow:0 4px 0 #e3c9a0}
.rrow .tx{flex:1;min-width:0}.rrow .tx b{font-weight:400;font-size:13px}.rrow small{display:block;color:#9a7a60;font-size:11px;line-height:1.45}
.rrow .rfaces{display:flex;flex:none}.rrow .rfaces canvas{width:34px;height:34px;object-fit:cover;object-position:50% 20%;border-radius:9px;border:2px solid #e3c9a0;background:#f6e6c8;margin-left:-8px}.rrow .rfaces canvas:first-child{margin-left:0}
.rrow.lock{opacity:.7}.rrow.lock .rfaces canvas{filter:brightness(0) opacity(.25)}
.rrow.new{border-color:#f6c343;box-shadow:0 4px 0 #e0a020,0 0 0 2px #fff3a0}
.rrow .rst{flex:none;font-size:11px;color:#9a7a60}
.rrow .newtag{opacity:1;top:-9px;right:-6px}
/* 이야기 보기: UI는 치우고 가운데에 작은 정사각형 컷신 + 아래 대사창만 */
#game.rumormode #hud,#game.rumormode #dock,#game.rumormode #goals,#game.rumormode #orders{display:none}
#rumor{position:fixed;inset:0;z-index:48;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 40%,rgba(30,42,60,.74),rgba(10,16,26,.92));animation:rIn .5s}
#rumor[hidden]{display:none}
#rumor.out{opacity:0;transition:opacity .4s}
@keyframes rIn{from{opacity:0}}
.rtitle{display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff7e8;text-shadow:0 2px 0 #3a2a1c}
.rtitle em{font-style:normal;font-size:11px;opacity:.85}
.rtitle b{font-weight:400;font-size:18px;letter-spacing:1px}
.rcut{position:relative;width:min(300px,72vw,40vh);aspect-ratio:1;padding:6px;background:#fbf1dc;border:4px solid #7a5236;border-radius:10px;box-shadow:0 6px 0 #5a3a22,0 10px 30px rgba(0,0,0,.45)}
.rcut canvas{display:block;width:100%;height:100%;border-radius:4px;image-rendering:auto}
.rcut.flip canvas{animation:cutIn .55s ease-out}
@keyframes cutIn{from{opacity:0;transform:scale(1.04)}}
.rdots{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);display:flex;gap:5px}
.rdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,247,232,.35)}.rdots i.on{background:#fff7e8}
.rbox{position:relative;width:100%;max-width:600px;min-height:118px;margin-top:10px;display:flex;gap:12px;align-items:flex-start;padding:16px 16px 12px;cursor:pointer;border-width:5px!important;border-radius:20px!important;box-shadow:0 6px 0 #5a3a22,inset 0 0 0 3px #fff7e8!important}
/* 말하는 이의 큰 초상화: 오프닝처럼 대사창 위(뒤)에 서 있음. 컷신보다 뒤에 있어서 컷신을 가리지 않음 */
#rumor .rtitle,#rumor .rcut,#rumor .rbox{position:relative;z-index:2}
#rumor .rbig{position:absolute;z-index:1;left:max(0px,calc(50vw - 600px));bottom:var(--rpb,150px);height:min(44vh,420px);width:auto;max-width:max(calc(50vw - 178px),36vw);object-fit:contain;object-position:left bottom;filter:drop-shadow(0 0 8px rgba(255,255,255,.9)) drop-shadow(0 0 3px #fff);animation:ptIn .45s cubic-bezier(.3,1.3,.6,1);pointer-events:none}
.rtx{flex:1;min-width:0}
.rnm{display:inline-block;margin-bottom:4px;padding:2px 12px;font-weight:400;font-size:13px;color:#fff7e8;background:linear-gradient(#cf9662,#a8774f);border:3px solid #7a5236;border-radius:9px;text-shadow:0 1px 0 #7a5236}
.rnm:empty{display:none}
.rtxt{margin:0;font-size:15px;line-height:1.65;min-height:50px}
.rbox.nar .rtxt{color:#7a5a40;font-style:italic}
.rbox.act .rtxt{color:#6a7a8a}
.rnext{position:absolute;right:14px;bottom:8px;font-size:11px;color:#a8774f;animation:blink 1.2s infinite}
.rskip{position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));padding:6px 12px;border-radius:10px;border:2px solid rgba(255,247,232,.6);background:rgba(0,0,0,.25);color:#fff7e8;font-size:12px}
.rrew{flex:1;text-align:center}
.rrew h4{margin:0 0 6px;font-weight:400;font-size:16px;color:var(--orange2)}
.rrew p{margin:0 0 10px;font-size:13px;line-height:1.7}
@media (max-width:600px){.rbox{padding:14px 12px 12px}.rtxt{font-size:14px}#rumor .rbig{height:min(26vh,210px);max-width:62vw;left:4px;filter:drop-shadow(0 0 3px rgba(255,255,255,.55))}
/* 폰: 컷신은 위쪽, 대사창은 아래쪽에 붙여서 그 사이 빈 곳에 초상화가 서도록 (컷신을 가리지 않게) */
#rumor{justify-content:flex-start;padding-top:max(64px,calc(env(safe-area-inset-top) + 52px))}#rumor .rbox{margin-top:auto}}
.sr{display:flex;gap:8px;align-items:center}
.play{width:34px;height:30px;border-radius:10px;border:3px solid var(--brown2);background:#fff8c4;color:var(--brown);font-size:12px;padding:0;box-shadow:0 3px 0 var(--brown2)}
.play:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brown2)}
</style>
</head>
<body>
<div id="game">
<canvas id="world"></canvas>
<div id="hud">
<div id="logo"><canvas id="logoCat" width="84" height="84"></canvas><b>고양이<br>해변섬</b></div>
<div id="res"></div>
<span class="sp"></span>
<button class="ibtn" data-act="shopinfo"><canvas data-icon="shop" width="28" height="28" style="width:28px;height:28px"></canvas>가게</button>
<button class="ibtn" data-act="rumor"><canvas data-icon="letter" width="28" height="28" style="width:28px;height:28px"></canvas>소문<i class="badge" id="rumorBadge" hidden></i></button>
<button class="ibtn" data-act="dex"><canvas data-icon="catface" width="28" height="28" style="width:28px;height:28px"></canvas>도감</button>
<button class="ibtn" data-act="settings"><canvas data-icon="gear" width="28" height="28" style="width:28px;height:28px"></canvas>설정</button>
</div>
<div id="orders"></div>
<div id="goals" class="panel"></div>
<div id="dock">
<button class="ibtn big" data-act="craft"><canvas data-icon="necklace" width="34" height="34" style="width:34px;height:34px"></canvas>상품 제작<i class="badge" id="craftBadge" hidden></i></button>
<button class="ibtn big" data-act="upgrade"><canvas data-icon="shop" width="34" height="34" style="width:34px;height:34px"></canvas>업그레이드</button>
<button class="ibtn big" data-act="decor"><canvas data-icon="pot" width="34" height="34" style="width:34px;height:34px"></canvas>꾸미기</button>
<button class="ibtn big" data-act="help"><canvas data-icon="catface" width="34" height="34" style="width:34px;height:34px"></canvas>알바<i class="badge" id="helpBadge" hidden></i></button></div>
</div>
<div id="opening" hidden><div class="otitle"><i class="cl l1"></i><i class="cl l2"></i><i class="cl r1"></i><i class="cl r2"></i><canvas class="ocat" width="140" height="118"></canvas><b>고양이 해변섬</b><small>~ Cat Beach Island ~</small></div></div>
<div id="story" hidden><canvas class="pt"></canvas><div class="sbox panel"><span class="nm">가게 주인</span><p class="txt"></p><button class="btn"></button></div></div>
<div id="toast" class="panel" hidden></div>
<div id="rumor" hidden><div class="rtitle"><em></em><b></b></div><div class="rcut"><canvas width="360" height="360"></canvas><span class="rdots"></span></div><div class="rbox panel"><div class="rtx"><b class="rnm"></b><p class="rtxt"></p></div><span class="rnext">▼</span></div><button class="rskip">건너뛰기 ▸▸</button></div>
<!-- 튜토리얼 안내 화살표: 투명한 흰 테두리 · 안쪽 아이보리 · 꼬리는 투명하게 사라짐 -->
<div id="coach" hidden><svg viewBox="0 0 44 70" width="44" height="70"><defs>

const nl=3+Math.floor(Math.random()*3);for(let i=0;i<nl;i++){const r=H*rnd(.1,.2);blob(W*rnd(.15,.85),H*rnd(.7,.82),r*rnd(1,1.6),r)}

const nu=3+Math.floor(Math.random()*6);for(let i=0;i<nu;i++){const r=H*rnd(.12,.42);blob(W*rnd(.12,.88),H*.68-r*rnd(.2,.9),r*rnd(.9,1.5),r)}

if(Math.random()<.6)blob(W*pick([rnd(.04,.14),rnd(.86,.96)]),H*rnd(.55,.8),H*rnd(.06,.12),H*rnd(.05,.09));

// 같은 모양으로 색만 다른 두 장: 낮(연한 하늘색) / 노을(붉은빛) — 곱하기로 덮어서 아래 그림이 비쳐 보임
const tintCopy=col=>{const o=document.createElement('canvas');o.width=CW;o.height=CH;const og=o.getContext('2d');og.drawImage(c,0,0);og.globalCompositeOperation='source-in';og.fillStyle=col;og.fillRect(0,0,CW,CH);return o};
const fw=CW*px,fh=CH*px;return{day:tintCopy('rgb(198,222,255)'),dusk:tintCopy('rgb(255,200,188)'),w:fw,h:fh,x:0,y:0,

function canCraft(p){return productOpen(p)&&Object.entries(p.need).every(([k,v])=>(S.res[k]||0)>=v)&&S.crafting.length<maxQueue()&&stockTotal()+shelfBound()<shelfCap()}

const spBox=id=>(S.cq&&S.cq.box&&S.cq.box[id])||0;
const spQueued=id=>S.crafting.filter(c=>c.forSp&&c.id===id).length;
const spLeft=id=>S.cq?Math.max(0,(SPECIAL[S.cq.k].need[id]||0)-spBox(id)-spQueued(id)):0; // 아직 더 만들어야 하는 개수

function canCraftFor(p){return S.cq&&!S.cq.ready&&p.lv<=S.lv.shop&&spLeft(p.id)>0&&Object.entries(p.need).every(([k,v])=>(S.res[k]||0)>=v)&&S.crafting.length<maxQueue()}
function craftFor(id){const p=PRODUCTS.find(x=>x.id===id);if(!canCraftFor(p))return;Object.entries(p.need).forEach(([k,v])=>S.res[k]-=v);

const p=PRODUCTS.find(x=>x.id===id);if(!canCraft(p))return;
Object.entries(p.need).forEach(([k,v])=>S.res[k]-=v);

const sh=(x,y,w)=>{g.fillStyle='rgba(40,60,40,.25)';g.beginPath();g.ellipse(x,y,w,w*.33,0,0,7);g.fill()};
// 소품: 도트 아이콘 이름 또는 '@그림이름'(IMG에 불러온 그림) · 5번째 값 1 = 고양이 앞에 덮어 그림 (예: 나뭇잎 이불)
const prop=([n,x,y,s])=>{const d=n[0]==='@'?IMG[n.slice(1)]:dropIcon(n);if(!d)return;const h=s*d.height/d.width;g.imageSmoothingEnabled=false;g.drawImage(d,x-s/2,y-h,s,h);g.imageSmoothingEnabled=true};
for(const p of cut.props||[])if(!p[4])prop(p);
// 컷신에는 고양이만, 정면 모습으로만 나옴
const cast=(cut.cast||[]).filter(c=>typeof c[0]==='number').sort((a,b)=>a[2]-b[2]),heads=[];
for(const[k,x,y,emo,H]of cast){const fr=CAT_FR[k],s=CAT_SPR&&CAT_SPR[k][0],hh=H||118;sh(x,y,hh*.28);
if(s){const kk=hh/fr[0][3],w=s.width*kk,h=s.height*kk;g.drawImage(s,x-w/2,y+GLOW*kk-h,w,h)}if(emo)heads.push([emo,x,y-hh])}
for(const p of cut.props||[])if(p[4])prop(p);
// 시간대 · 날씨 색
const t=RMOOD[cut.m];if(t){g.globalCompositeOperation='multiply';g.fillStyle=`rgb(${t})`;g.fillRect(0,0,W,W);g.globalCompositeOperation='source-over'}
if(cut.m==='night'){g.globalCompositeOperation='lighter';const l=g.createRadialGradient(W*.7,W*.25,4,W*.7,W*.25,W*.5);l.addColorStop(0,'rgba(255,190,90,.28)');l.addColorStop(1,'rgba(255,190,90,0)');g.fillStyle=l;g.fillRect(0,0,W,W);g.globalCompositeOperation='source-over'}
if(cut.m==='rain'){g.strokeStyle='rgba(232,243,255,.45)';g.lineWidth=1.5;g.beginPath();for(let i=0;i<70;i++){const x=(i*53.7)%W,y=(i*97.3)%W;g.moveTo(x,y);g.lineTo(x,y+16)}g.stroke()}
// 감정 표시 (Zzz · ! · ? · … · 하트 · 눈물)
for(const[e,x,y]of heads){const bx=x+22,by=y-4;if(e==='tear'){g.fillStyle='#7ec8f0';g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(bx,by-12);g.quadraticCurveTo(bx+8,by,bx,by+4);g.quadraticCurveTo(bx-8,by,bx,by-12);g.fill();g.stroke();continue}
if(e==='heart'){g.imageSmoothingEnabled=false;g.drawImage(icon('heart'),bx-11,by-14,22,20);g.imageSmoothingEnabled=true;continue}
const tx=e==='z'?'Zzz':e;g.font="bold 17px 'Galmuri11',sans-serif";g.textAlign='center';g.textBaseline='middle';g.lineWidth=4;g.strokeStyle='#fff';g.strokeText(tx,bx+6,by-6);g.fillStyle=e==='!'?'#e0521a':'#5a3d2b';g.fillText(tx,bx+6,by-6)}
// 가장자리 살짝 어둡게
const v=g.createRadialGradient(W/2,W/2,W*.35,W/2,W/2,W*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(30,20,10,.35)');g.fillStyle=v;g.fillRect(0,0,W,W);g.restore()}
// 큰 초상화 (시간대 조명 없이 원래 색): 고양이 / 가게 주인 / 후드친구
function rumorPortrait(who){const im=who==='h'?IMG.hoodpt:IMG.heropt,r=im?[0,0,im.width,im.height]:null,c=document.createElement('canvas');if(!im||!r)return c;
c.width=r[2];c.height=r[3];const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(im,r[0],r[1],r[2],r[3],0,0,r[2],r[3]);return c}
// 초상화를 대사창 위쪽 가장자리에 세움 (말하는 이가 바뀔 때만 다시 등장)
function rPortrait(who){const el=$('#rumor');let p=el.querySelector('.rbig');const key=String(who);
if(who===''||typeof who==='number'){if(p)p.remove();return} // 해설 · 고양이 대사에는 초상화 없음 (가게 주인 · 나만)
if(!p||p.dataset.who!==key){if(p)p.remove();p=rumorPortrait(who);p.className='rbig';p.dataset.who=key;el.appendChild(p)}
// PC: 초상화 아래 끝 = 대사창 아래 끝 (대사창 뒤로 서 있음) / 폰: 대사창 위에 서 있음
const b=el.querySelector('.rbox');if(b){const r=b.getBoundingClientRect();el.style.setProperty('--rpb',(innerWidth>600?innerHeight-r.bottom:innerHeight-r.top-12)+'px')}}
addEventListener('resize',()=>{if(RP&&!RP.end){const e=RP.R.L[RP.i];if(e&&typeof e!=='number')rPortrait(e[0])}});
let rumorPausedAt=0;
function playRumor(id){const R=RUMORS.find(r=>r.id===id);if(!R)return;$('#modal').hidden=true;if(!rumorOn)rumorPausedAt=now();rumorOn=true;$('#game').classList.add('rumormode');$('#toast').hidden=true;
const el=$('#rumor');el.hidden=false;el.classList.remove('out');el.querySelector('.rtitle em').textContent='고양이 섬의 소문';el.querySelector('.rtitle b').textContent=`「${R.t}」`;
el.querySelector('.rbox').outerHTML='<div class="rbox panel"><div class="rtx"><b class="rnm"></b><p class="rtxt"></p></div><span class="rnext">▼</span></div>';
el.querySelector('.rdots').innerHTML=R.cuts.map(()=>'<i></i>').join('');
RP={R,i:0,ci:-1,end:false};loadRumorArt(R);rShow();
el.onclick=e=>{if(e.target.closest('.rskip')){sPop();rEnd();return}if(e.target.closest('[data-rclose]')){sPop();rClose();return}if(RP.end)return;
const p=el.querySelector('.rtxt'),cur=R.L[RP.i];if(p._t&&cur&&p.textContent.length<cur[1].length){clearInterval(p._t);p.textContent=cur[1];return} // 글자가 나오는 중이면 한 번에
audio();sPop();RP.i++;rShow()}}
function rSetCut(n){const R=RP.R;if(RP.ci===n)return;RP.ci=n;drawCut(R,n);const c=$('#rumor .rcut');c.classList.remove('flip');void c.offsetWidth;c.classList.add('flip');
$('#rumor .rdots').querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i===n))}
function rShow(){const R=RP.R;let e=R.L[RP.i];while(typeof e==='number'){rSetCut(e);RP.i++;e=R.L[RP.i]}if(RP.ci<0)rSetCut(0);if(!e){rEnd();return}
const[who,t]=e,box=$('#rumor .rbox');box.classList.toggle('nar',who==='');box.classList.toggle('act',who==='h');
box.querySelector('.rnm').textContent=who===''?'':typeof who==='number'?CATS[who].n:RNAME[who];
rPortrait(who);
typeText(box.querySelector('.rtxt'),t);if(typeof who==='number')sMeow(who)}
// 끝: 처음 보면 보상 받기 (다시 볼 때는 보상 없음)
function rEnd(){if(!RP||RP.end)return;const R=RP.R,first=!S.rumor.read[R.id];RP.end=true;RP.first=first;
if(first){S.rumor.read[R.id]=1;S.rf[R.id]=1;save();uiDirty=true;sBabam()}else sFind();rSetCut(R.cuts.length-1);rPortrait('');
$('#rumor .rbox').outerHTML=`<div class="rbox panel"><div class="rrew"><h4>✨ 소문 「${esc(R.t)}」</h4><p>${R.rw.map(esc).join('<br>')}${first?'':'<br><small style="color:#9a7a60">(이미 받은 보상이에요)</small>'}</p><button class="btn or" data-rclose>섬으로 돌아가기</button></div></div>`;checkRumors()}
function rClose(){const el=$('#rumor'),R=RP.R,first=RP.first;
if(S.crafting[0])S.crafting[0].end+=now()-rumorPausedAt; // 멈춰 있던 동안 제작 시간도 흐르지 않음
el.classList.add('out');setTimeout(()=>{el.hidden=true;el.classList.remove('out')},400);
$('#game').classList.remove('rumormode');rumorOn=false;RP=null;if(first)toast(`📜 ${R.rw[0]}`,R.icon)}

// ===== 시작 =====
(async()=>{
await Promise.all([load('bg1','assets/island.png'),load('cats','assets/cat_frames.png'),load('catpt','assets/cat_portraits.png'),load('hero','assets/hero.png'),load('heropt','assets/hero_portrait.png'),load('hood','assets/hood.png'),load('hoodpt','assets/hood_portrait.png'),load('leaf','assets/leaf_blanket.png'),load('stage0','assets/stage_plain.png'),load('stage1','assets/stage_ribbon.png')]);
// 소문 미리보기: 오프닝·튜토리얼 건너뛰고 모든 고양이·소문을 연 상태로 시작 (저장 안 함)
if(RTEST){S.intro=true;S.firstDone=true;S.firstCust=1;S.coach='done';for(let k=0;k<12;k++)S.dex[k]=1;S.dexNew={};S.unlockSeen=12;RUMORS.forEach(R=>S.rumor.un[R.id]=1);setTimeout(()=>{openRumors();showToast('🔧 소문 미리보기 모드 — 여기서 한 일은 저장되지 않아요','letter')},400)}
// 로고: 귤이 얼굴
const lc=$('#logoCat'),lg=lc.getContext('2d');lg.imageSmoothingQuality='high';const r=CAT_PT[0];if(IMG.catpt)lg.drawImage(IMG.catpt,r[0],r[1],r[2],r[2]*.84,0,4,84,84*.84);
// 캐릭터는 대비↑로 또렷하게 (한 번만 미리 처리). 배경 색감은 그림 파일 그대로 사용
const tuned=(img,f)=>{if(!img)return img;const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const g=c.getContext('2d');g.filter=f;g.drawImage(img,0,0);return c};IMG.cats=tuned(IMG.cats,'contrast(1.2) saturate(1.12)');IMG.hero=tuned(IMG.hero,'contrast(1.18) saturate(1.1)');IMG.hood=tuned(IMG.hood,'contrast(1.12) saturate(1.08)');
bakeCats();initClouds();paintIcons();renderAll();resize();
// 이어서 할 때는 섬 전체가 보이게 시작
if(S.intro){zoom=islandZoom();view.s=view.base*zoom;cam.x=ISLAND.x;cam.y=ISLAND.y;clampCam()}
Object.keys(S.dexNew||{}).forEach(k=>introQ.push(+k)); // 인사를 못 보고 껐던 고양이
// 진행 중이던 제작은 다시 켰을 때 남은 시간부터 (꺼져 있던 동안은 진행하지 않음)
if(S.crafting.length){S.crafting[0].end=now()+(S.crafting[0].left||craftMs(prod(S.crafting[0])))}
// 일하던 알바 고양이 다시 불러오기
Object.keys(S.help).forEach(k=>{if(helping(+k))spawnHelper(+k);else delete S.help[k]});
requestAnimationFrame(t=>{last=t;loop(t)});
if(!S.intro)startOpening();
})();
// 처음 이야기: 왼쪽 아래에 큰 초상화, 아래쪽(제작 버튼 자리)에 대사창. [시작하기] 전까지 손님은 오지 않음
// 오프닝: 바다 전경 → 타이틀이 툭 떨어지고 양옆 구름 펑 → 사라지면 가게로 클로즈업 → 주인공이 화면 밖에서 걸어 들어옴 → 대사
let openingOn=false;
function startOpening(){
const op=$('#opening'),gm=$('#game');openingOn=true;gm.classList.add('opening');
hero.state='hidden';hero.x=HOME[0];hero.y=HOME[1];
zoom=1;view.s=view.base;cam.x=WORLD_W/2;cam.y=WORLD/2;clampCam();
op.hidden=false;op.classList.remove('bye');
const oc=op.querySelector('.ocat'),og=oc.getContext('2d'),pr=CAT_PT[0];og.imageSmoothingQuality='high';if(IMG.catpt)og.drawImage(IMG.catpt,pr[0],pr[1],pr[2],pr[2]*.84,0,0,140,118);
const T0=[];let skipped=false;const at=(ms,f)=>T0.push(setTimeout(f,ms));
at(850,()=>{tone(180,120,.12,.2,'triangle');sPop()}); // 쿵!
at(1000,()=>{tone(523,523,.25,.06,'triangle');tone(784,784,.35,.05,'triangle',.08)});
const next=()=>{if(skipped)return;skipped=true;T0.forEach(clearTimeout);
op.classList.add('bye');setTimeout(()=>{op.hidden=true;openingOn=false;gm.classList.remove('opening')},600);
// 가게 쪽으로 클로즈업 (주인공이 설 자리가 초상화·대사창에 가리지 않게)
const z=Math.min(ZMAX,2),s=view.base*z;
flyTo(HOME[0]-(view.W*(view.W<600?.8:.68)-view.W/2)/s,HOME[1]-(view.H*.4-view.H/2)/s,z,1.8,()=>{ // 다 다가가면 화면 오른쪽 밖에서 걸어 들어오기
hero.x=(view.W-view.ox)/view.s+60;hero.y=HOME[1];hero.state='enter';
hero.onArrive=()=>setTimeout(startStory,500)})};
at(3200,next);op.onclick=()=>{audio();next()}; // 누르면 바로 넘어감
}
function startStory(){
const lines=['와앗~!! 어서 와요!!','연락은 받은 지 이미 오래돼서, 오시기만을 손꼽아 기다리고 있었어요!','이 가게를 도와주신다고 하셨다면서요? 정말 고마워요~!',
'앗, 잠깐만요! 곧 고양이 손님들이 찾아오실 거예요!','고양이 손님들이 오시기 전에 가게를 준비해야 해요. 재료도 모으고, 물건도 만들고, 좋아하실 만한 상품도 준비해야 하거든요!',
'재료는 제가 섬을 한 바퀴씩 돌면서 조개·해초·유목을 모아 올게요. 모인 재료로 상품을 만들어 진열대에 놓아 주세요!','걱정 마세요! 제가 하나씩 알려드릴게요. 그럼 우리 같이 시작해 볼까요?'];
const st=$('#story'),p=st.querySelector('.txt'),btn=st.querySelector('.btn');let i=0;
st.querySelector('.pt').replaceWith(Object.assign(heroPortrait(560),{className:'pt'}));
$('#game').classList.add('storymode');st.hidden=false;
// 대사창 높이를 재서 초상화를 그 위에 세움 (화면 크기 바뀔 때도)
const fit=()=>{if(!st.hidden){const b=st.querySelector('.sbox');st.style.setProperty('--bh',(b.offsetHeight+parseFloat(getComputedStyle(b).bottom))+'px')}};
// 초상화·대사창에 가리지 않게 주인공이 화면 오른쪽 위쪽에 보이도록 카메라 이동
// 이야기 동안은 주인공을 크게 확대해서 보여줌
zoom=Math.min(ZMAX,2);view.s=view.base*zoom;
const aim=()=>{if(S.intro)return;cam.x=hero.x-(view.W*(view.W<600?.8:.68)-view.W/2)/view.s;cam.y=hero.y-(view.H*.4-view.H/2)/view.s;clampCam()};aim();
addEventListener('resize',fit);addEventListener('resize',aim);
const show=()=>{typeText(p,lines[i]);btn.textContent=i<lines.length-1?'다음 ▶':'시작하기';fit()};show();
st.querySelector('.sbox').onclick=()=>{
if(i>=lines.length)return; // 이미 끝남 (사라지는 중에 또 누른 경우)
if(p._t&&p.textContent.length<lines[i].length){clearInterval(p._t);p.textContent=lines[i];return} // 글자가 나오는 중이면 한 번에 다 보여 줌
audio();sPop();i++;if(i<lines.length){show();return}
st.classList.add('out');setTimeout(()=>{st.hidden=true;st.classList.remove('out')},350);$('#game').classList.remove('storymode');
S.intro=true;spawnT=3;hero.state='walk';hero.emote=HERO_ANIM.happy[1];hero.emoteT=.8;save();uiDirty=true; // 시작! → 자동 채집 출발
flyTo(ISLAND.x,ISLAND.y,islandZoom(),1.8); // 섬 전체가 보이게 쭉 축소
};
}
// 인터넷에 올렸을 때(https): 오프라인에서도 열리게 파일 저장 (안드로이드 앱 안에서는 필요 없음)
if('serviceWorker' in navigator&&location.protocol==='https:'&&location.hostname!=='catisland.example')navigator.serviceWorker.register('sw.js').catch(()=>{});
// 아이폰 Safari: 두 손가락 확대가 화면 전체 확대로 새지 않게
document.addEventListener('gesturestart',e=>e.preventDefault());
// 끌 때 남은 제작 시간 기억
function remember(){if(S.crafting[0])S.crafting[0].left=Math.max(0,S.crafting[0].end-now());save()}
addEventListener('pagehide',remember);document.addEventListener('visibilitychange',()=>{if(AC){if(document.hidden){AC.suspend();bgmEl.pause()}else{AC.resume();startBgm()}}if(document.hidden)remember();else if(S.crafting[0]&&S.crafting[0].left!=null){S.crafting[0].end=now()+S.crafting[0].left;S.crafting[0].left=null}});
</script>
