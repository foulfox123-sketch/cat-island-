<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>고양이 해변섬</title>
<meta name="theme-color" content="#1c90b8">
<!-- 홈 화면 앱 (아이폰 Safari '홈 화면에 추가' / 안드로이드 크롬 '앱 설치') -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="고양이 해변섬">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{--cream:#fbf1dc;--cream2:#f3e3c3;--brown:#7a5236;--brown2:#a8774f;--ink:#5a3d2b;--green:#6fae5b;--green2:#4f8f40;--orange:#ef8a4a;--orange2:#d26a2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#15708f}
body{font:13px/1.35 'Galmuri11','Galmuri9',"Malgun Gothic",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse at 50% 50%,#1a83a6,#125f7a)}
/* 게임 창 = 배경 그림(정사각형)에 딱 맞는 크기 */
#game{position:fixed;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.12),0 10px 40px rgba(0,30,50,.45)}
canvas#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#dock{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.ibtn.big{width:76px;height:72px;font-size:11px;position:relative}
.badge{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--orange);color:#fff;border:2px solid #fff;font:11px/18px 'Galmuri11',sans-serif;font-style:normal;padding:0 5px}
.badge[hidden]{display:none}
.cgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.cgrid2 .card{flex:none}
.px{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle}
.panel{background:var(--cream);border:3px solid var(--brown);border-radius:14px;box-shadow:0 4px 0 rgba(90,55,30,.35),inset 0 0 0 2px #fff7e8}
button{font:inherit;color:inherit;cursor:pointer}
/* 위쪽: 로고 · 자원 · 도감/설정 */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));pointer-events:none}
#hud>*{pointer-events:auto}
#logo{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 6px;border-radius:999px;background:rgba(251,241,220,.92);border:3px solid var(--brown);box-shadow:0 3px 0 rgba(90,55,30,.35)}
#logo canvas{width:42px;height:42px}
#logo b{font-size:18px;line-height:1;color:var(--brown);letter-spacing:1px;text-shadow:2px 2px 0 #fff}
#res{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:1}
.chip{display:flex;align-items:center;gap:8px;min-width:86px;padding:5px 14px 5px 8px;border-radius:12px;background:var(--cream);border:3px solid var(--brown);box-shadow:0 3px 0 rgba(90,55,30,.35);font-size:17px;justify-content:space-between}
.chip.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.15)}}
.ibtn{width:62px;height:62px;border-radius:14px;background:var(--cream);border:3px solid var(--brown);box-shadow:0 3px 0 rgba(90,55,30,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;padding:0}
.ibtn:active,.chip:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(90,55,30,.35)}
/* 튜토리얼 · 퀘스트 */
#goals{position:absolute;left:12px;top:78px;width:240px;padding:9px 12px 11px}
.qh{display:flex;justify-content:space-between;align-items:center}
.qtag{background:linear-gradient(#f8ad78,#ef8a4a);color:#fff;border:2px solid #b8602a;border-radius:9px;padding:1px 8px;font-size:11px;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.qr{display:flex;align-items:center;gap:3px;font-size:12px;color:#b77a10}
.qt{font-size:14px;margin:6px 0 2px}
.qhint{font-size:11px;color:#9a7a60;margin-bottom:2px}
.qbar{position:relative;height:16px;margin-top:6px;border-radius:9px;background:#ead9bb;border:2px solid var(--brown2);overflow:hidden}
.qbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#b4e69a,#6fae5b);transition:width .3s}
.qbar span{position:relative;display:block;text-align:center;font-size:10px;line-height:12px}
.qclaim{width:100%;margin-top:8px;animation:wiggle 1.2s infinite}
@keyframes wiggle{0%,100%{transform:none}10%{transform:rotate(-2deg) scale(1.03)}20%{transform:rotate(2deg) scale(1.03)}30%{transform:none}}
/* 튜토리얼이 가리키는 버튼 반짝반짝 */
.ibtn.hint{animation:hint 1s infinite;border-color:#e0a020}
@keyframes hint{50%{transform:translateY(-4px);box-shadow:0 0 0 4px #fff3a0,0 0 18px 6px #ffd84a}}
/* 제작 · 업그레이드 창 안 */
.card{display:flex;gap:8px;padding:10px;border-radius:14px;background:#fffaf0;border:3px solid #e3c9a0;box-shadow:0 4px 0 #e3c9a0}
.card .ic{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:#f6e6c8;border:2px solid #e3c9a0;border-radius:10px;padding:6px 0 4px;font-size:11px}
.card .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card b{font-weight:400;font-size:13px;white-space:nowrap}
.need{display:flex;gap:8px;font-size:11px;flex-wrap:wrap}
.need span{display:flex;align-items:center;gap:2px}
.need .lack{color:#d0503a}
.card.locked{opacity:.55;filter:grayscale(.6)}
/* 볼록한 3D 버튼 */
.btn{border:3px solid #3f7a33;background:linear-gradient(#8ccb73,#6fae5b);color:#fff;border-radius:12px;padding:7px 10px;font-size:12px;box-shadow:0 4px 0 #3f7a33,inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 1px 0 rgba(0,0,0,.25);position:relative;overflow:hidden;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3f7a33}
.btn.or{background:linear-gradient(#f8ad78,#ef8a4a);border-color:#b8602a;box-shadow:0 4px 0 #b8602a,inset 0 2px 0 rgba(255,255,255,.45)}
/* 돈·재료가 부족하면 회색 (누를 수 없음) */
.btn[disabled],.btn.or[disabled]{background:linear-gradient(#ddd5c6,#cbc1b0);border-color:#a8977a;box-shadow:0 4px 0 #a8977a;color:#f8f4ec;text-shadow:none;cursor:default;transform:none}
.btn .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.35)}
.stock{font-size:11px;color:#8a6a50}
#upgList{display:flex;flex-direction:column;gap:8px}
.urow{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fffaf0;border:3px solid #e3c9a0;border-radius:14px;box-shadow:0 4px 0 #e3c9a0}
.urow .tx{flex:1;min-width:0;font-size:12px}
.urow .tx small{display:block;color:#9a7a60;font-size:10px}
/* 창 */
#modal{position:fixed;inset:0;background:rgba(30,60,80,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal[hidden]{display:none}
.dlg{position:relative;width:560px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;padding:38px 16px 16px;margin-top:20px;animation:pop .2s cubic-bezier(.3,1.4,.6,1)}
#modal .dlg.panel{border:6px solid #7a5236;border-radius:24px;background:#fbf1dc;box-shadow:0 8px 0 #5a3a22,0 16px 34px rgba(0,30,50,.35),inset 0 0 0 4px #fff7e8,inset 0 -10px 0 rgba(168,119,79,.14)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
/* 제목: 위에 걸린 나무 간판 */
.dlg h3{position:absolute;left:50%;top:-24px;transform:translateX(-50%);margin:0;white-space:nowrap;font-size:16px;font-weight:400;display:flex;align-items:center;gap:8px;padding:7px 22px 6px;color:#fff7e8;background:linear-gradient(#cf9662,#a8774f);border:4px solid #7a5236;border-radius:14px;box-shadow:0 4px 0 #5a3a22,inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 2px 0 #7a5236}
.dlg h3 img{filter:drop-shadow(0 1px 0 #7a5236)}
/* 닫기: 연노랑 둥근 상자 */
.dlg .x{position:absolute;right:-16px;top:-16px;z-index:2;width:38px;height:38px;padding:0;background:linear-gradient(#fff8c4,#ffe98a);border:4px solid #7a5236;border-radius:12px;box-shadow:0 4px 0 #5a3a22,inset 0 2px 0 #fff;font:bold 18px/26px sans-serif;color:#7a5236}
.dlg .x:active{transform:translateY(3px);box-shadow:0 1px 0 #5a3a22}
.dlg .in{overflow-y:auto}
.dex{padding:10px 8px 4px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.dexc{background:#fffaf0;border:3px solid #e3c9a0;box-shadow:0 4px 0 #e3c9a0;border-radius:14px;padding:6px;text-align:center;font-size:12px}
.dexc canvas{width:100%;height:auto;display:block}
.dexc.no canvas{filter:brightness(0) opacity(.25)}
.dexc small{display:block;color:#9a7a60;font-size:10px;min-height:26px}
/* 오프닝 타이틀: 위에서 툭 떨어짐 → 양옆 구름 펑 → 사라짐 */
#game.opening #hud{display:none}
#opening{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .6s}
#opening[hidden]{display:none}
#opening.bye{opacity:0}
#opening.bye .otitle{transform:scale(.9) translateY(-20px);transition:transform .6s}
.otitle{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:-8vh;animation:odrop .9s cubic-bezier(.35,1.6,.5,1) both}
@keyframes odrop{0%{transform:translateY(-110vh)}70%{transform:translateY(0) scaleY(.92) scaleX(1.05)}100%{transform:none}}
.ocat{width:clamp(80px,14vw,130px);height:auto;filter:drop-shadow(0 4px 0 #7a5236) drop-shadow(0 0 10px #fff)}
.otitle b{--o:clamp(3px,.55vw,6px);font-weight:400;font-size:clamp(42px,9vw,96px);line-height:1.15;color:#fff7e8;letter-spacing:2px;white-space:nowrap;
text-shadow:var(--o) 0 0 #7a5236,calc(var(--o)*-1) 0 0 #7a5236,0 var(--o) 0 #7a5236,0 calc(var(--o)*-1) 0 #7a5236,var(--o) var(--o) 0 #7a5236,calc(var(--o)*-1) var(--o) 0 #7a5236,var(--o) calc(var(--o)*-1) 0 #7a5236,calc(var(--o)*-1) calc(var(--o)*-1) 0 #7a5236,0 calc(var(--o)*2.2) 0 #5a3a22,var(--o) calc(var(--o)*2.2) 0 #5a3a22,calc(var(--o)*-1) calc(var(--o)*2.2) 0 #5a3a22}
.otitle small{margin-top:6px;font-size:clamp(13px,2vw,20px);color:#fff;text-shadow:0 2px 0 #7a5236,0 0 8px #3a8fb0}
.otap{position:absolute;bottom:12vh;margin:0;color:#fff;font-size:15px;text-shadow:0 2px 0 #3a7f9c;animation:blink 1.4s 1.6s infinite both}
@keyframes blink{0%,100%{opacity:0}50%{opacity:1}}
/* 구름: 하얀 동그라미 뭉치 */
.cl{position:absolute;top:58%;width:clamp(90px,14vw,170px);height:clamp(30px,4.4vw,52px);border-radius:999px;background:#fff;opacity:0;filter:drop-shadow(0 5px 0 rgba(110,170,205,.45));animation:puff 2.2s ease-out both}
.cl::before,.cl::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cl::before{width:48%;aspect-ratio:1;left:14%;bottom:30%}
.cl::after{width:36%;aspect-ratio:1;right:14%;bottom:38%}
.cl.l1{right:100%;top:62%;--dx:-40px;animation-delay:.78s}.cl.l2{right:88%;top:8%;--dx:-70px;animation-delay:.92s}
.cl.r1{left:100%;top:62%;--dx:40px;animation-delay:.78s}.cl.r2{left:88%;top:8%;--dx:70px;animation-delay:.92s}
@keyframes puff{0%{opacity:0;transform:translateX(0) scale(.3)}18%{opacity:1;transform:translateX(var(--dx)) scale(1)}70%{opacity:.95;transform:translateX(calc(var(--dx)*1.5)) scale(1.08)}100%{opacity:0;transform:translateX(calc(var(--dx)*2.3)) scale(1.25)}}
/* 처음 이야기: 왼쪽 아래 큰 초상화 + 아래 대사창 (이때는 퀘스트·제작 버튼을 숨김) */
#game.storymode #dock,#game.storymode #goals{display:none}
#story{position:fixed;inset:0;z-index:40;pointer-events:none}
#story[hidden]{display:none}
/* 초상화는 대사창 바로 위에 서 있게 (대사창 높이 --bh는 JS가 재서 넣음), 위쪽 자원창은 피함 */
#story .pt{position:absolute;left:max(0px,calc(50vw - 520px));bottom:calc(var(--bh,170px) - 14px);height:min(52vh,520px,calc(100vh - var(--bh,170px) - 110px));width:auto;max-width:80vw;object-fit:contain;filter:drop-shadow(0 0 8px rgba(255,255,255,.95)) drop-shadow(0 0 3px #fff);animation:ptIn .5s cubic-bezier(.3,1.3,.6,1)}
@keyframes ptIn{from{transform:translateX(-60px);opacity:0}}
#story .sbox{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:980px;margin:0 auto;min-height:150px;padding:24px 20px 16px;pointer-events:auto;cursor:pointer;border-width:5px;border-radius:20px;box-shadow:0 6px 0 #5a3a22,inset 0 0 0 3px #fff7e8;animation:boxIn .35s}
@keyframes boxIn{from{transform:translateY(40px);opacity:0}}
#story .nm{position:absolute;left:22px;top:-20px;padding:5px 18px;font-size:15px;color:#fff7e8;background:linear-gradient(#cf9662,#a8774f);border:4px solid #7a5236;border-radius:12px;box-shadow:0 3px 0 #5a3a22;text-shadow:0 2px 0 #7a5236}
#story .txt{margin:0 0 12px;font-size:17px;line-height:1.65;min-height:56px}
#story .btn{float:right;font-size:14px;padding:9px 18px}
#story.out{opacity:0;transition:opacity .35s}
@media (max-width:600px){#story .pt{left:-6px;height:min(40vh,calc(66vw * 1.29),calc(100vh - var(--bh,170px) - 110px))}#story .sbox{min-height:140px;padding:22px 14px 12px}#story .txt{font-size:15px}}
/* 피크 타임: 코인 칸에 불꽃 + 테두리·글씨 반짝반짝 */
.chip{position:relative}
.chip .fire{display:none;font-style:normal;font-size:18px;line-height:1}
.chip.peak{border-color:#ff9a1f;animation:peakglow .7s ease-in-out infinite alternate;overflow:visible}
.chip.peak .fire{display:inline-block;animation:flick .35s infinite alternate}
.chip.peak span{color:#e0521a;text-shadow:0 0 6px #ffe066,0 0 12px #ffb347;animation:peaktext .7s infinite alternate}
.chip.peak::after{content:'';position:absolute;inset:-3px;border-radius:14px;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:250% 100%;animation:shine 1.2s linear infinite;pointer-events:none}
@keyframes peakglow{from{box-shadow:0 3px 0 rgba(90,55,30,.35),0 0 6px 2px #ffd84a}to{box-shadow:0 3px 0 rgba(90,55,30,.35),0 0 16px 6px #ff9a1f}}
@keyframes peaktext{to{transform:scale(1.08)}}
@keyframes flick{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(8deg) scale(1.2)}}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
.chip .ptime{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;white-space:nowrap;font-style:normal;font-size:11px;color:#fff;background:#e0521a;border:2px solid #fff;border-radius:8px;padding:0 6px}
.chip .ptime:empty{display:none}
/* 튜토리얼 안내 화살표 (통통 튀면서 가리킴) */
#coach{position:fixed;z-index:70;pointer-events:none;display:flex;flex-direction:column;align-items:center;transition:left .25s,top .25s}
#coach[hidden]{display:none}
#coach svg{filter:drop-shadow(0 0 1.5px rgba(122,82,54,.7)) drop-shadow(0 2px 3px rgba(90,60,30,.35));animation:cbounce .8s ease-in-out infinite}
#coach.up svg{transform:rotate(180deg);animation-name:cbounceUp}
#coach .ctxt{order:-1} /* 아래를 가리킬 땐 설명 → 화살표 → 버튼 순 */
#coach.up .ctxt{order:1} /* 위를 가리킬 땐 대상 → 화살표 → 설명 순 */
@keyframes cbounce{0%,100%{transform:translateY(-6px)}50%{transform:translateY(5px)}}
@keyframes cbounceUp{0%,100%{transform:rotate(180deg) translateY(-6px)}50%{transform:rotate(180deg) translateY(5px)}}
#coach .ctxt{margin:4px 0;max-width:220px;text-align:center;font-size:12px;line-height:1.45;color:var(--ink);background:rgba(255,250,238,.95);border:2px solid #e3c9a0;border-radius:10px;padding:5px 10px;box-shadow:0 2px 0 rgba(90,55,30,.2);white-space:normal}
/* 제작 창 위로 띄운 주문 대기열 (튜토리얼 안내용) */
#ordersLift{position:fixed;z-index:65;display:flex;align-items:flex-start;gap:8px;pointer-events:none;filter:drop-shadow(0 0 10px rgba(255,240,180,.95));animation:pop .25s}
#ordersLift .otag{align-self:center;font-size:13px;color:#fff;background:var(--brown);border-radius:9px;padding:4px 9px;box-shadow:0 2px 0 #5a3a22}
/* 손님 주문 대기열 (타이쿤처럼 화면 위쪽 가운데) */
#orders{position:absolute;left:50%;top:72px;transform:translateX(-50%);display:flex;align-items:flex-start;gap:8px;pointer-events:none;z-index:3}
#orders:empty{display:none}
#orders .otag{align-self:center;font-size:13px;color:#fff;background:var(--brown);border-radius:9px;padding:4px 9px;box-shadow:0 2px 0 #5a3a22}
.ord{position:relative;display:flex;align-items:center;gap:6px;padding:4px 10px 10px 4px;background:var(--cream);border:3px solid var(--brown);border-radius:14px;box-shadow:0 3px 0 rgba(90,55,30,.35);animation:pop .25s}
.ord .face{width:46px;height:46px;border-radius:10px;object-fit:cover;object-position:50% 20%;background:#f6e6c8}
.ord img.px{width:34px!important;height:34px!important}
.ord .bar{position:absolute;left:7px;right:7px;bottom:3px;height:5px;border-radius:3px;background:#e4d6bd;overflow:hidden}
.ord .bar i{display:block;height:100%;transition:width .2s}
.ord .ok{position:absolute;right:-7px;top:-8px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;border:2px solid #fff;font:bold 11px/14px sans-serif;text-align:center}
.ord.come{opacity:.55}
.ord.come .bar{display:none}
.ord.hurry{animation:hurry .5s infinite alternate}
@keyframes hurry{to{border-color:#ef6a4a}}
#game.port #orders{top:122px}
#game.small #orders{top:84px;gap:4px}
#game.small .ord .face{width:32px;height:32px}
#game.small .ord img.px{width:24px!important;height:24px!important}
/* 업그레이드 가능: 금빛으로 반짝 + 별 */
.ibtn.canup{border-color:#e0a020;animation:canup 1.1s ease-in-out infinite}
.ibtn.canup::after{content:'✦';position:absolute;right:4px;top:2px;font-size:14px;color:#ffc93c;text-shadow:0 0 6px #fff;animation:twinkle 1.1s infinite}
@keyframes canup{50%{box-shadow:0 3px 0 rgba(90,55,30,.35),0 0 0 3px #fff3a0,0 0 18px 6px #ffd84a}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
.urow{position:relative}
.urow.reco{border-color:#f6c343;box-shadow:0 4px 0 #e0a020,0 0 0 2px #fff3a0}
.recot{position:absolute;left:-6px;top:-10px;font-style:normal;font-size:10px;color:#fff;background:#ef8a4a;border:2px solid #fff;border-radius:8px;padding:0 6px;transform:rotate(-6deg)}
/* 고양이 특별 주문 */
.cq{margin:-2px 0 8px;padding:7px 9px;border-radius:12px;background:#fff1dc;border:2px dashed #ef8a4a}
.cqh{font-size:12px;color:#d2541c}
.cqt{font-size:13px;margin:3px 0;display:flex;align-items:center;gap:4px}

const DAY_KEYS=[[0,[255,255,255]],[4.6,[255,255,255]],[5.6,[255,190,148]],[6.9,[255,180,140]],[7.7,[92,104,178]],[9.2,[92,104,178]],[9.7,[255,224,205]],[10,[255,255,255]]];
const dayMin=()=>((S.playTime||0)%DAY_LEN)/60;
function dayTint(){const m=dayMin();for(let i=1;i<DAY_KEYS.length;i++){const[a,ca]=DAY_KEYS[i-1],[b,cb]=DAY_KEYS[i];if(m<=b){const t=(m-a)/(b-a);return ca.map((v,j)=>Math.round(v+(cb[j]-v)*t))}}return[255,255,255]}
function dayPhase(){const m=dayMin();return m<5.1||m>=9.5?'day':m<7.3?'sunset':'night'}

let AC=null,BUS={};
function audio(){
if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();
const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
for(const k of['sfx','bgm','amb']){BUS[k]=AC.createGain();BUS[k].connect(comp)}
BUS.bgm.gain.value=S.bgm?BGM_VOL:0;BUS.amb.gain.value=.55;BUS.sfx.gain.value=S.sound?1:0;}
if(AC.state==='suspended')AC.resume();startBgm();return AC;
}
function ac(){const a=audio();return a&&S.sound?a:null}
function tone(f1,f2,dur,vol=.18,type='sine',delay=0,bus='sfx'){const a=bus==='sfx'?ac():audio();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(BUS[bus]);o.start(t);o.stop(t+dur+.02)}
function noiseBuf(a,sec){const b=a.createBuffer(1,a.sampleRate*sec,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
const sPop=()=>{tone(760,340,.09);tone(1140,700,.05,.06,'sine',.02)};
const sCoin=()=>{tone(1320,1320,.08,.12,'square');tone(1760,1760,.18,.1,'square',.07)};
const sGather=()=>{tone(520,880,.08,.12);tone(880,1180,.1,.08,'sine',.06)};
// 고양이마다 목소리 높이가 다른 야옹
const sMeow=(k=0)=>{const p=.8+((k*37)%12)/24;tone(600*p,920*p,.12,.11,'triangle');tone(920*p,500*p,.24,.11,'triangle',.11)};
const sDone=()=>{[660,880,1100,1320].forEach((f,i)=>tone(f,f,.13,.09,'triangle',i*.07))};
const sHammer=()=>{const a=ac();if(!a)return;[0,.16].forEach(d=>{tone(180,90,.08,.25,'square',d);const n=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+d;n.buffer=noiseBuf(a,.06);f.type='bandpass';f.frequency.value=1800;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);n.connect(f).connect(g).connect(BUS.sfx);n.start(t)})};
const sFanfare=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,f,.18,.1,'triangle',i*.09));tone(1568,1568,.35,.06,'sine',.36)};
// 빠밤~! (도감 해금): 짧은 화음 → 길게 울리는 화음 + 반짝
const sBabam=()=>{[392,494,587].forEach(f=>{tone(f,f,.13,.07,'square');tone(f*2,f*2,.13,.04,'triangle')});[523,659,784,1047].forEach(f=>{tone(f,f*1.005,.75,.07,'triangle',.17);tone(f/2,f/2,.6,.04,'square',.17)});[1568,2093,2637].forEach((f,i)=>tone(f,f,.25,.04,'sine',.45+i*.08))};
const sFind=()=>{[784,988,1175,1568].forEach((f,i)=>tone(f,f*1.01,.16,.08,'sine',i*.1))};
// 파도 철썩: 걸러낸 잡음을 밀려왔다 빠지게
function sWave(force){const a=audio();if(!a||!(force||S.wave!==false))return;const t=a.currentTime,n=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();n.buffer=noiseBuf(a,3.2);f.type='lowpass';f.frequency.setValueAtTime(300,t);f.frequency.linearRampToValueAtTime(1400,t+.9);f.frequency.exponentialRampToValueAtTime(250,t+3);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.32,t+.85);g.gain.exponentialRampToValueAtTime(.12,t+1.4);g.gain.exponentialRampToValueAtTime(.0001,t+3.1);n.connect(f).connect(g).connect(BUS.amb);n.start(t)}
// 갈매기 끼룩끼룩 (멀리서 들리듯 부드럽게: 톱니파 대신 삼각파 + 살짝 떨림)
function sGull(force){const a=audio();if(!a||!(force||S.gull!==false))return;const t0=a.currentTime;for(let i=0;i<2+(Math.random()<.5?1:0);i++){const t=t0+i*.38,o=a.createOscillator(),v=a.createOscillator(),vg=a.createGain(),f=a.createBiquadFilter(),g=a.createGain(),base=rnd(820,980);o.type='triangle';o.frequency.setValueAtTime(base,t);o.frequency.linearRampToValueAtTime(base*1.25,t+.09);o.frequency.linearRampToValueAtTime(base*.78,t+.28);v.frequency.value=22;vg.gain.value=base*.025;v.connect(vg).connect(o.frequency);f.type='lowpass';f.frequency.value=2200;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(f).connect(g).connect(BUS.amb);o.start(t);v.start(t);o.stop(t+.33);v.stop(t+.33)}}
// 배경음악: assets/bgm.mp3 (칼림바·아코디언, 끊김 없이 반복되게 만든 곡) — 버퍼로 무한 반복

// 화면을 빈틈없이 꽉 채움: 배경을 화면보다 크게(cover) 그리고, 잘린 부분은 손가락/마우스로 끌어서 봄. UI는 위에 겹쳐 올림

// 시작 배율은 시작 화면에서 정함 (처음 이야기: 주인공 확대 / 그 외: 섬 전체)
const cam={x:900,y:470},ZMIN=1,ZMAX=3;let zoom=1;
// 섬 전체가 잘 보이는 배율·위치 (섬: 대략 330~1250 × 100~800)
const ISLAND={x:790,y:450,w:960,h:760};
const islandZoom=()=>Math.max(ZMIN,Math.min(ZMAX,Math.min(view.W/ISLAND.w,view.H/ISLAND.h)/view.base));
// 카메라를 부드럽게 이동·확대 (시작하기 → 섬 전체로 쭉 빠짐)
let camTw=null;
function flyTo(x,y,z,dur,done){camTw={x0:cam.x,y0:cam.y,z0:zoom,x,y,z,t:0,dur,done}}
function stepCam(dt){if(!camTw)return;const w=camTw;w.t=Math.min(1,w.t+dt/w.dur);const e=w.t<.5?2*w.t*w.t:1-Math.pow(-2*w.t+2,2)/2;
zoom=w.z0+(w.z-w.z0)*e;view.s=view.base*zoom;cam.x=w.x0+(w.x-w.x0)*e;cam.y=w.y0+(w.y-w.y0)*e;clampCam();if(w.t>=1){camTw=null;if(w.done)w.done()}}
function clampCam(){const v=view,hw=v.W/2/v.s,hh=v.H/2/v.s;cam.x=Math.max(hw,Math.min(WORLD_W-hw,cam.x));cam.y=Math.max(hh,Math.min(WORLD-hh,cam.y));v.ox=v.W/2-cam.x*v.s;v.oy=v.H/2-cam.y*v.s}

// 끌어서 섬 둘러보기
// 화면의 (px,py) 지점을 고정한 채로 확대/축소
// 직접 움직이면 자동 이동은 멈춤 (이어서 할 일은 바로 실행)
const stopTw=()=>{if(camTw){const d=camTw.done;camTw=null;if(d)d()}};cv.addEventListener('pointerdown',stopTw);cv.addEventListener('wheel',stopTw);
function setZoom(z,px,py){const wx=(px-view.ox)/view.s,wy=(py-view.oy)/view.s;zoom=Math.max(ZMIN,Math.min(ZMAX,z));view.s=view.base*zoom;cam.x=wx+(view.W/2-px)/view.s;cam.y=wy+(view.H/2-py)/view.s;clampCam()}
// 한 손가락/마우스 = 끌어서 이동, 두 손가락 = 벌리고 오므려서 확대/축소
const ptrs=new Map();let pinch=null;
const mid=()=>{const a=[...ptrs.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}};
// 한 손가락 동작 구분:
//  · 바로 끌기 = 화면 이동
//  · 0.3초 가만히 꾹 누르기 (마우스는 오른쪽 버튼) = 청소기 모드 → 화면은 고정되고, 끄는 대로 청소기 원이 따라다니며 재료를 빨아들임
//  · 살짝 눌렀다 떼기 = 그 자리 재료 줍기
let tap=null,pmode=null,holdT=null;const HOLD_MS=300;
function startVac(x,y){pmode='vac';vac={x,y};tap=null;if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}tone(500,900,.08,.05,'sine')}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cv.setPointerCapture(e.pointerId)}catch(_){}clearTimeout(holdT);
if(ptrs.size===2){pinch=mid();pmode='pinch';tap=null;vac=null;return}
tap={x:e.clientX,y:e.clientY};vac=null;pmode='wait';
if(e.button===2&&S.intro){startVac(e.clientX,e.clientY);return}
holdT=setTimeout(()=>{if(pmode==='wait'&&S.intro){const p=ptrs.get(e.pointerId);if(p)startVac(p.x,p.y)}},HOLD_MS)});
cv.addEventListener('pointerup',e=>{clearTimeout(holdT);if(pmode==='wait'&&tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<10)pickAt(e.clientX,e.clientY);tap=null;vac=null;pmode=null});
cv.addEventListener('pointercancel',()=>{clearTimeout(holdT);vac=null;pmode=null});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
if(ptrs.size>=2){p.x=e.clientX;p.y=e.clientY;const m=mid();if(pinch&&pinch.d>0){cam.x-=(m.x-pinch.x)/view.s;cam.y-=(m.y-pinch.y)/view.s;clampCam();setZoom(zoom*m.d/pinch.d,m.x,m.y)}pinch=m;return}
if(pmode==='vac'){vac.x=e.clientX;vac.y=e.clientY;p.x=e.clientX;p.y=e.clientY;return} // 청소기 중엔 화면 고정
if(pmode==='wait'){if(Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<10)return;clearTimeout(holdT);pmode='pan';tap=null}
if(pmode!=='pan')return;
cam.x-=(e.clientX-p.x)/view.s;cam.y-=(e.clientY-p.y)/view.s;p.x=e.clientX;p.y=e.clientY;clampCam()});
const endPtr=e=>{ptrs.delete(e.pointerId);pinch=ptrs.size===2?mid():null;if(ptrs.size===1&&pmode==='pinch')pmode='pan'};cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
// 마우스 휠(스크롤) = 확대/축소

function drawSprite(img,r,x,y,h,flip){
if(!img)return;const k=h/r[3],w=r[2]*k;ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(img,r[0],r[1],r[2],r[3],-w/2,-h,w,h);ctx.restore();
}
function shadow(x,y,w){ctx.fillStyle='rgba(40,60,40,.22)';ctx.beginPath();ctx.ellipse(x,y,w,w*.35,0,0,7);ctx.fill()}
function bubble(x,y,content,w=34,h=30){
ctx.save();ctx.fillStyle='#fffaf0';ctx.strokeStyle='#7a5236';ctx.lineWidth=2.5;const r=8;
ctx.beginPath();ctx.moveTo(x-w/2+r,y-h);ctx.arcTo(x+w/2,y-h,x+w/2,y,r);ctx.arcTo(x+w/2,y,x-w/2,y,r);ctx.lineTo(x+4,y);ctx.lineTo(x,y+7);ctx.lineTo(x-4,y);ctx.arcTo(x-w/2,y,x-w/2,y-h,r);ctx.arcTo(x-w/2,y-h,x+w/2,y-h,r);ctx.closePath();ctx.fill();ctx.stroke();
content(x,y-h/2);ctx.restore();
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawIcon(n,x,y,size){const s=icon(n);ctx.imageSmoothingEnabled=false;ctx.drawImage(s,x-size/2,y-size/2,size,size*s.height/s.width);ctx.imageSmoothingEnabled=true}

// 구름 그림자: 테두리가 또렷한 도트 구름 (사진 속 그림자처럼). 크기·모양이 매번 제각각이고, 화면 밖으로 나가면 새 모양으로 다시 들어옴
function makeCloud(){
// 구름 몸통(W×H) 둘레에 넉넉한 여백(P)을 둬서, 몽실한 덩어리가 캔버스 끝에 닿아 일자로 잘려 보이는 일이 없게
const w=rnd(340,640),h=w*rnd(.32,.62),px=5,W=Math.ceil(w/px),H=Math.ceil(h/px),P=Math.ceil(H*.6),c=document.createElement('canvas');c.width=W+P*2;c.height=H+P*2;const g=c.getContext('2d');g.fillStyle='#000';
const blob=(x,y,rx,ry)=>{rx=Math.max(1,Math.min(rx,P+W/2-2));ry=Math.max(1,Math.min(ry,P+H/2-2));g.beginPath();g.ellipse(P+x,P+y,rx,ry,0,0,7);g.fill()};
// 아랫면: 납작한 덩어리 1~3개를 어긋나게
const nb=1+Math.floor(Math.random()*3);for(let i=0;i<nb;i++)blob(W*rnd(.3,.7),H*rnd(.58,.7),W*rnd(.16,.3),H*rnd(.12,.2));
// 아랫면도 울퉁불퉁하게 (일자로 잘린 느낌 없게)
const nl=3+Math.floor(Math.random()*3);for(let i=0;i<nl;i++){const r=H*rnd(.1,.2);blob(W*rnd(.15,.85),H*rnd(.7,.82),r*rnd(1,1.6),r)}
// 윗면: 크기가 제각각인 몽실 3~8개
const nu=3+Math.floor(Math.random()*6);for(let i=0;i<nu;i++){const r=H*rnd(.12,.42);blob(W*rnd(.12,.88),H*.68-r*rnd(.2,.9),r*rnd(.9,1.5),r)}
// 가끔 떨어져 나온 작은 조각
if(Math.random()<.6)blob(W*pick([rnd(.04,.14),rnd(.86,.96)]),H*rnd(.55,.8),H*rnd(.06,.12),H*rnd(.05,.09));
// 반투명한 가장자리를 없애서 테두리를 딱 끊어지게
const CW=c.width,CH=c.height,d=g.getImageData(0,0,CW,CH);for(let i=3;i<d.data.length;i+=4)d.data[i]=d.data[i]>110?255:0;g.putImageData(d,0,0);

// 같은 모양으로 색만 다른 두 장: 낮(연한 하늘색) / 노을(붉은빛) — 곱하기로 덮어서 아래 그림이 비쳐 보임
const tintCopy=col=>{const o=document.createElement('canvas');o.width=CW;o.height=CH;const og=o.getContext('2d');og.drawImage(c,0,0);og.globalCompositeOperation='source-in';og.fillStyle=col;og.fillRect(0,0,CW,CH);return o};
const fw=CW*px,fh=CH*px;return{day:tintCopy('rgb(198,222,255)'),dusk:tintCopy('rgb(255,200,188)'),w:fw,h:fh,x:0,y:0,
bx:P*px,by:P*px,bw:W*px,bh:H*px}} // bx~bh: 실제 구름 몸통 (겹침 검사용)
// 구름은 모두 같은 속도로 흘러서 서로 겹치지 않고, 가끔은 구름 없는 맑은 하늘도 있음
// 구름 낀 때(2~4분) ↔ 맑은 때(2~3분, 새 구름이 안 와서 남은 구름이 다 지나가면 그림자 없음)가 번갈아
const CLOUD_SP=16;let clouds=[],cloudT=0,cloudy={on:true,t:rnd(120,240)};
const cloudBox=c=>({x:c.x+c.bx,y:c.y+c.by,w:c.bw,h:c.bh});
function cloudFits(c){const a=cloudBox(c);return clouds.every(o=>{const b=cloudBox(o);return a.x+a.w+40<b.x||b.x+b.w+40<a.x||a.y+a.h+30<b.y||b.y+b.h+30<a.y})}
// 가게 줄(세로 230~480)에는 구름 몸통이 지나가지 않게 → 구름은 가게보다 위쪽(폭포 쪽) 또는 아래쪽(광장·해변)으로만 흘러감
const SHOP_BAND=[230,480];
const offShop=c=>{const t=c.y+c.by,b=t+c.bh;return b<SHOP_BAND[0]||t>SHOP_BAND[1]};
function placeCloud(c,xMin,xMax){for(let i=0;i<20;i++){c.x=rnd(xMin,xMax)-c.bx;c.y=(Math.random()<.4?rnd(-c.bh*.5,SHOP_BAND[0]-c.bh-5):rnd(SHOP_BAND[1]+5,WORLD-c.bh*.6))-c.by;if(offShop(c)&&cloudFits(c)){clouds.push(c);return true}}return false}
function initClouds(){clouds=[];const n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++)placeCloud(makeCloud(),-200,WORLD_W-200);cloudT=rnd(5,20)}
function moveClouds(dt){clouds.forEach(c=>c.x+=CLOUD_SP*dt);clouds=clouds.filter(c=>c.x+c.bx<WORLD_W+20);
cloudy.t-=dt;if(cloudy.t<=0)cloudy=cloudy.on?{on:false,t:rnd(160,240)}:{on:true,t:rnd(120,240)};
cloudT-=dt;if(cloudy.on&&cloudT<=0){const c=makeCloud();cloudT=placeCloud(c,-c.bw-60,-c.bw-10)?rnd(12,32):3}}
// 구름 그림자는 땅에만 (캐릭터보다 먼저 그려서 주인공·고양이에는 안 덮임)
function drawClouds(){const n=nightness();if(weather.type==='rain'||n>=.9||!clouds.length)return;const s=sunsetAmt();
ctx.save();ctx.globalCompositeOperation='multiply';ctx.imageSmoothingEnabled=false;
for(const c of clouds){if(s<1){ctx.globalAlpha=(1-n)*(1-s);ctx.drawImage(c.day,c.x,c.y,c.w,c.h)}if(s>0){ctx.globalAlpha=(1-n)*s;ctx.drawImage(c.dusk,c.x,c.y,c.w,c.h)}}
ctx.restore();ctx.imageSmoothingEnabled=true}
// 떨어진 재료가 잘 보이게: 시간대 색조 위에 연한 원형 빛(숨 쉬듯) + 반짝이 별 / 청소기 범위 원
function drawDropFx(){
ctx.save();
for(const d of drops){const k=Math.max(1,.7/view.s),cy=d.y-14*k,pulse=1+Math.sin(T*2.4+d.x*.07)*.15,R=40*k*pulse,a=Math.min(1,d.age*3);
ctx.globalCompositeOperation='screen';ctx.globalAlpha=a;const g=ctx.createRadialGradient(d.x,cy,2,d.x,cy,R);g.addColorStop(0,'rgba(255,236,150,.55)');g.addColorStop(.5,'rgba(255,226,130,.22)');g.addColorStop(1,'rgba(255,226,130,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(d.x,cy,R,0,7);ctx.fill();
ctx.globalCompositeOperation='source-over';ctx.globalAlpha=a*(.35+Math.sin(T*2.4+d.x*.07)*.15);ctx.strokeStyle='#fff6c8';ctx.lineWidth=2*k;ctx.beginPath();ctx.arc(d.x,cy,24*k*pulse,0,7);ctx.stroke();
for(let j=0;j<2;j++){const ph=T*1.7+d.x*.13+j*3.1,tw=Math.max(0,Math.sin(ph));if(tw<.2)continue;const sx=d.x+Math.cos(j*2.4+d.y)*20*k,sy=cy-18*k+Math.sin(j*1.9+d.x)*10*k,L=(3+tw*5)*k;
ctx.globalAlpha=a*tw;ctx.fillStyle='#fff';ctx.fillRect(sx-L,sy-.8*k,L*2,1.6*k);ctx.fillRect(sx-.8*k,sy-L,1.6*k,L*2)}}
if(vac&&S.intro){const wx=(vac.x-view.ox)/view.s,wy=(vac.y-view.oy)/view.s,R=VAC_R/view.s;ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.16;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(wx,wy,R,0,7);ctx.fill();
ctx.globalAlpha=.55+Math.sin(T*8)*.15;ctx.strokeStyle='#fff';ctx.lineWidth=3/view.s;ctx.setLineDash([10/view.s,8/view.s]);ctx.lineDashOffset=-T*30/view.s;ctx.beginPath();ctx.arc(wx,wy,R,0,7);ctx.stroke()}
ctx.restore()}
// 하늘: 시간대 색조(노을·밤) → 밤엔 가게 불빛 · 비 오는 날은 어둡게
function drawSky(){
const n=nightness(),rain=weather.type==='rain';
const t=dayTint();if(rain)for(let j=0;j<3;j++)t[j]=Math.round(t[j]*.8);
if(t[0]<253||t[1]<253||t[2]<253){ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgb(${t})`;ctx.fillRect(-50,-50,WORLD_W+100,WORLD+100);ctx.restore()}
if(n>.05){ctx.save();ctx.globalCompositeOperation='lighter';for(const[x,y,r]of[[930,330,110],[830,380,70],[1060,330,80],[1240,640,70],[1110,400,60]]){const f=.9+Math.sin(T*3+x)*.1,g=ctx.createRadialGradient(x,y,4,x,y,r);g.addColorStop(0,`rgba(255,190,90,${.42*n*f})`);g.addColorStop(1,'rgba(255,190,90,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}ctx.restore()}
}
// 비: 가늘고 연한 빗줄기가 제각각 위치에서 위→아래 일직선으로. 화면 기준으로 움직임
let rainDrops=[],splashes=[];
function stepRain(dt){
if(weather.type!=='rain'||!view.W){rainDrops.length=0;splashes.length=0;return}
const W=view.W,H=view.H,want=Math.round(W*H/5500);
while(rainDrops.length<want)rainDrops.push({x:Math.random()*W,y:Math.random()*H,v:rnd(650,950),l:rnd(14,26)});
for(const d of rainDrops){d.y+=d.v*dt;if(d.y>H+20){d.y=-rnd(10,H*.3);d.x=Math.random()*W;d.v=rnd(650,950);d.l=rnd(14,26)}}
// 섬 바닥 군데군데 아주 조금 튀는 빗방울 (세계 좌표: 모래·풀 위 지점 근처)
if(Math.random()<dt*7){const p=pick(DROP_PTS.concat(SPOTS.map(s=>[s.x,s.y])));splashes.push({x:p[0]+rnd(-60,60),y:p[1]+rnd(-40,40),t:0})}
splashes.forEach(s=>s.t+=dt);splashes=splashes.filter(s=>s.t<.4)}
function drawSplashes(){if(!splashes.length)return;ctx.save();for(const s of splashes){const p=s.t/.4;ctx.globalAlpha=(1-p)*.7;ctx.strokeStyle='#eaf4ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(s.x,s.y,3+p*10,(3+p*10)*.35,0,0,7);ctx.stroke();
ctx.fillStyle='#eaf4ff';const h=Math.sin(p*Math.PI)*8;ctx.fillRect(s.x-5-p*4,s.y-h,2,2);ctx.fillRect(s.x+4+p*4,s.y-h*.8,2,2)}ctx.restore()}
function drawRain(){if(weather.type!=='rain'||!view.W)return;const W=view.W,H=view.H;ctx.save();ctx.fillStyle='rgba(60,85,120,.12)';ctx.fillRect(0,0,W,H);
// 빗줄기: 굵기 2px, 위쪽은 거의 투명 → 아래로 갈수록 살짝 진해지는 그라데이션 (3단으로 나눠 그림)
ctx.lineWidth=2;ctx.lineCap='round';[[0,.33,.12],[.33,.66,.3],[.66,1,.5]].forEach(([a,b,al])=>{ctx.strokeStyle=`rgba(232,243,255,${al})`;ctx.beginPath();for(const d of rainDrops){ctx.moveTo(d.x,d.y+d.l*a);ctx.lineTo(d.x,d.y+d.l*b)}ctx.stroke()});ctx.restore()}
// 알바 고양이: 고양이 그림 + 머리 위에 줍는 재료 / 바구니 표시
function drawHelper(h){drawCat(h);if(h.state==='gather'){const k=Math.max(1,.8/view.s);bubble(h.x,h.y-78,(x,y)=>drawIcon(SPOTS[h.si].t,x,y,20*k),34*k,30*k)}
else{const k=Math.max(1,.8/view.s);ctx.save();ctx.font=`${11*k}px 'Galmuri11',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3*k;ctx.strokeStyle='#fff';ctx.strokeText('알바 중',h.x,h.y-74);ctx.fillStyle='#d2691e';ctx.fillText('알바 중',h.x,h.y-74);ctx.restore()}}
function drawHero(){
if(hero.state==='hidden')return; // 오프닝 타이틀 동안은 아무도 없음
const img=IMG.hero;shadow(hero.x,hero.y,16);
let idx,flip=false;
if(hero.emoteT>0)idx=hero.emote;
else if(hero.state==='idle')idx=[0,1,0,1,8,16,8,20][Math.floor(T*2.2)%8]; // 숨쉬기 ↔ 웃으며 인사
else if(hero.state==='gather')idx=HERO_ANIM.happy[Math.floor(T*3)%2?0:2];
else if(!hero.moving)idx=HERO_ANIM.down[Math.floor(T*1.5)%2];
else{const d=hero.dir,a=d==='left'||d==='right'?HERO_ANIM.left:HERO_ANIM[d];idx=a[Math.floor(hero.step*7)%a.length];flip=d==='right'}
const r=HERO[idx];const bob=hero.moving?Math.abs(Math.sin(hero.step*14))*3:0;
// 주인공은 고양이보다 크게 + 흰 바깥 빛으로 잘 보이게
const hh=r[3]*.64;ctx.save();ctx.shadowColor='rgba(255,255,255,.95)';ctx.shadowBlur=9;drawSprite(img,r,hero.x,hero.y-bob,hh,flip);ctx.shadowBlur=3;drawSprite(img,r,hero.x,hero.y-bob,hh,flip);ctx.restore();
if(hero.state==='gather'){const p=1-hero.timer/gatherTime(S.lv.basket),by=hero.y-hh-14;ctx.fillStyle='rgba(90,60,40,.45)';ctx.fillRect(hero.x-24,by,48,8);ctx.fillStyle='#8bd06a';ctx.fillRect(hero.x-24,by,48*p,8);
// 이 구역에서 나오는 재료 표시
const k=Math.max(1,.8/view.s);bubble(hero.x,by-6,(x,y)=>drawIcon(SPOTS[hero.gi].t,x,y,20*k),34*k,30*k)}
}
function drawCat(c){
const fr=CAT_FR[c.k];shadow(c.x,c.y,13);
let fi=0,flip=false;
if(c.moving){const side=c.vx!==0&&Math.abs(c.vx)>=Math.abs(c.vy);if(side){fi=Math.floor(c.step*6)%2?1:2;flip=c.vx>0}else fi=c.vy<0?3:0}
const r=fr[fi],bob=c.moving?Math.abs(Math.sin(c.step*12))*2.5:Math.sin(T*2+c.k)*.8;
// 고양이마다 정면 키 66 기준으로 같은 배율 (옆·뒷모습은 시트 안에서 작게 그려져 있어서 1.13배)
const k=66/fr[0][3]*(fi?1.13:1);
if(CAT_SPR){const s=CAT_SPR[c.k][fi],w=s.width*k,h=s.height*k;ctx.save();ctx.translate(c.x,c.y-bob+GLOW*k);if(flip)ctx.scale(-1,1);ctx.drawImage(s,-w/2,-h,w,h);ctx.restore()}
// 기다려 주는 시간 게이지 (초록 → 노랑 → 빨강)
if(c.state==='wait'&&c.waitMax){const p=Math.max(0,c.wait/c.waitMax),k=Math.max(1,.85/view.s),w=46*k,h=7*k,b=2*k,x=c.x-w/2,y=c.y+7;
ctx.fillStyle='#7a5236';rrect(x-b,y-b,w+b*2,h+b*2,h/2+b);ctx.fill();ctx.fillStyle='#f3e3c3';rrect(x,y,w,h,h/2);ctx.fill();
if(p>0&&!(p<.25&&Math.sin(T*12)<0)){ctx.fillStyle=p>.5?'#7fcf5f':p>.25?'#f6c343':'#ef6a4a';rrect(x,y,Math.max(h,w*p),h,h/2);ctx.fill()}}
if(c.say)talkBubble(c.x,c.y-80,c.say.t);
else if(c.bub){const b=c.bub;bubble(c.x,c.y-80,(x,y)=>{if(b==='heart')drawIcon('heart',x,y,20);else if(b==='...'){ctx.fillStyle='#5a3d2b';ctx.font="bold 14px sans-serif";ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('...',x,y)}else drawIcon(b,x,y,20)})}
}

// ===== 시간 =====
const now=()=>Date.now();
let last=performance.now(),acc=0;
function loop(t){
let dt=Math.min(.1,(t-last)/1000);last=t;
if(!document.hidden){T+=dt;update(dt);stepCam(dt)}
draw();requestAnimationFrame(loop);
}

// ===== 움직임 =====
function moveTo(e,tx,ty,speed,dt){
const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);
if(d<2){e.x=tx;e.y=ty;e.moving=false;e.vx=e.vy=0;return true}
const s=Math.min(d,speed*dt);e.x+=dx/d*s;e.y+=dy/d*s;e.moving=true;e.vx=dx;e.vy=dy;e.step+=dt;
e.dir=Math.abs(dx)>Math.abs(dy)*.8?(dx<0?'left':'right'):(dy<0?'up':'down');return false;
}
function update(dt){
// 플레이 시간 (켜 둔 동안만) → 새 손님 해금 알림
S.playTime=(S.playTime||0)+dt;
const un=unlockedCount();if(un>(S.unlockSeen||1)){S.unlockSeen=un;toast('누군가 섬에 찾아온 것 같아요… 가게에 오면 도감에 등록돼요','catface');sGull()}
// 주인공: 정해진 길을 돌며 준비된 재료를 모음
if(hero.emoteT>0)hero.emoteT-=dt;
// [시작하기] 전: 가게 앞에 서서 인사 애니메이션만 (채집은 시작 후)
// 오프닝: 'hidden'(안 보임) → 'enter'(화면 밖에서 걸어 들어옴) → 'idle'(가게 앞에서 인사)
if(!S.intro){
if(hero.state==='enter'){if(moveTo(hero,HOME[0],HOME[1],heroSpeed(1)*.85,dt)){hero.state='idle';hero.dir='down';hero.emote=HERO_ANIM.happy[1];hero.emoteT=1.1;if(hero.onArrive){const f=hero.onArrive;hero.onArrive=null;f()}}}
else if(hero.state!=='hidden'){hero.state='idle';hero.moving=false;hero.dir='down'}}
else if(hero.state==='idle'||hero.state==='hidden'||hero.state==='enter')hero.state='walk';
if(hero.state==='idle'||hero.state==='hidden'||hero.state==='enter'){}
// 구역마다 나오는 재료가 정해져 있음 (조개 3·해초 3·유목 3구역) → 한 바퀴 돌면 모든 재료가 모임. 땅엔 아이템이 안 보이고 주인공은 줍는 동작만
else if(hero.state==='gather'){hero.timer-=dt;if(hero.timer<=0){const sp=SPOTS[hero.gi],n=basketYield(S.lv.basket);gain(sp.t,n,sp.x,sp.y-40);hero.state='walk';hero.route=(hero.route+1)%HERO_ROUTE.length;sGather()}}
else if(hero.state==='rest'){hero.timer-=dt;if(hero.timer<=0){hero.state='walk';hero.route=(hero.route+1)%HERO_ROUTE.length}}
else{
const step=HERO_ROUTE[hero.route];let tx,ty,spot=null;
if(step.length===1){spot=step[0];tx=SPOTS[spot].x;ty=SPOTS[spot].y+6}else{tx=step[0];ty=step[1]}
if(moveTo(hero,tx,ty,heroSpeed(S.lv.shoes),dt)){
if(spot!==null){hero.state='gather';hero.gi=spot;hero.timer=gatherTime(S.lv.basket);hero.dir='down'}
else if(step[2]==='shop'){hero.state='rest';hero.timer=1.2;hero.emote=HERO_ANIM.happy[1+Math.floor(Math.random()*3)];hero.emoteT=1.2}
else hero.route=(hero.route+1)%HERO_ROUTE.length;
}}
// 제작: 끝난 것은 진열대로 (특별 주문 상품은 퀘스트 창에서 전달)
if(S.crafting.length&&S.crafting[0].end<=now()){const c=S.crafting.shift();

// 2) 제작 창이 열리면: 위쪽 주문 대기열을 창 위로 띄워서 가리킴 (3초)
if(st==='ordersIn'){if(!$('#cards')||!modalOpen){S.coach='craft';c.hidden=true;return}
if(!liftOrders(true)){S.coach='craftBtn';return} // 줄 선 손님이 없으면 바로 다음
coachTo($('#ordersLift'),'고양이 손님이 원하는 아이템을 확인해요!','up');if(performance.now()-coachShownAt>3000){S.coach='craftBtn';liftOrders(false);c.hidden=true}return}
// 3) 첫 손님이 원하는 상품의 제작하기 버튼
if(st==='craftBtn'){if(!$('#cards')||!modalOpen){S.coach='craft';c.hidden=true;return}
const w=firstWant(),b=(w&&$(`#cards [data-craft="${w.id}"]:not([disabled])`))||$('#cards [data-craft]:not([disabled])');
if(!b){c.hidden=true;return}coachTo(b,w&&b.dataset.craft===w.id?'첫 번째 고양이 손님의 물건을 제작해볼까요?':'제작하기를 눌러요!','down');return}
// 업그레이드 안내는 12초 보여 주고, 무시하면 1분 쉬었다가 다시 (다른 알림을 오래 막지 않게)
if(st==='upgWait'){if(modalOpen||!S.firstDone||!UPGRADES.some(canUpg)||performance.now()<coachRestUntil){c.hidden=true;return}coachTo($('#dock [data-act="upgrade"]'),'업그레이드로 더 빠른 제작과 채집을 해 보아요~','down');
if(performance.now()-coachShownAt>12000){c.hidden=true;coachRestUntil=performance.now()+60000}return}
// 업그레이드 창: 추천 빌드 차례인 업그레이드를 가리킴 (돈이 모자라면 살 수 있는 것)
if(st==='upgBtn'){if(!$('#upgList')||!modalOpen){S.coach='upgWait';c.hidden=true;return}
const rb=$('#upgList .urow.reco [data-upg]:not([disabled])');
coachTo(rb||$('#upgList [data-upg]:not([disabled])'),rb?'추천 업그레이드부터 올려 봐요!':'올릴 수 있는 업그레이드예요!','down');return}}
setInterval(stepCoach,200);addEventListener('resize',stepCoach);
function toast(msg,ic){if(quiet()||toastBusy){if(toastQ.length<6&&!toastQ.some(q=>q[0]===msg))toastQ.push([msg,ic]);return}showToast(msg,ic)}
function showToast(msg,ic){const t=$('#toast');toastBusy=true;t.innerHTML=(ic?ii(ic,24):'')+`<span>${esc(msg)}</span>`;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;setTimeout(()=>{toastBusy=false;nextToast()},1500)},3000)}
function nextToast(){if(quiet()||toastBusy||!toastQ.length)return;const[m,i]=toastQ.shift();showToast(m,i)}
setInterval(nextToast,1000);
function toastCat(k){const t=$('#toast');t.innerHTML='';t.appendChild(portraitCanvas(k,46));t.insertAdjacentHTML('beforeend',`<span><b style="font-weight:400;color:var(--orange2)">새 주민 발견!</b><br>${esc(CATS[k].n)} · ${esc(CATS[k].look)}</span>`);t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200);sFind()}

// ===== 시작 =====
(async()=>{
await Promise.all([load('bg1','assets/island.png'),load('cats','assets/cat_frames.png'),load('catpt','assets/cat_portraits.png'),load('hero','assets/hero.png'),load('heropt','assets/hero_portrait.png')]);
// 로고: 귤이 얼굴
const lc=$('#logoCat'),lg=lc.getContext('2d');lg.imageSmoothingQuality='high';const r=CAT_PT[0];if(IMG.catpt)lg.drawImage(IMG.catpt,r[0],r[1],r[2],r[2]*.84,0,4,84,84*.84);
// 캐릭터는 대비↑로 또렷하게 (한 번만 미리 처리). 배경 색감은 그림 파일 그대로 사용
const tuned=(img,f)=>{if(!img)return img;const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const g=c.getContext('2d');g.filter=f;g.drawImage(img,0,0);return c};IMG.cats=tuned(IMG.cats,'contrast(1.2) saturate(1.12)');IMG.hero=tuned(IMG.hero,'contrast(1.18) saturate(1.1)');
bakeCats();initClouds();paintIcons();renderAll();resize();
// 이어서 할 때는 섬 전체가 보이게 시작
if(S.intro){zoom=islandZoom();view.s=view.base*zoom;cam.x=ISLAND.x;cam.y=ISLAND.y;clampCam()}
Object.keys(S.dexNew||{}).forEach(k=>introQ.push(+k)); // 인사를 못 보고 껐던 고양이
// 진행 중이던 제작은 다시 켰을 때 남은 시간부터 (꺼져 있던 동안은 진행하지 않음)
if(S.crafting.length){S.crafting[0].end=now()+(S.crafting[0].left||craftMs(prod(S.crafting[0])))}
// 일하던 알바 고양이 다시 불러오기
Object.keys(S.help).forEach(k=>{if(helping(+k))spawnHelper(+k);else delete S.help[k]});
requestAnimationFrame(t=>{last=t;loop(t)});
if(!S.intro)startOpening();
})();
// 처음 이야기: 왼쪽 아래에 큰 초상화, 아래쪽(제작 버튼 자리)에 대사창. [시작하기] 전까지 손님은 오지 않음
// 오프닝: 바다 전경 → 타이틀이 툭 떨어지고 양옆 구름 펑 → 사라지면 가게로 클로즈업 → 주인공이 화면 밖에서 걸어 들어옴 → 대사
let openingOn=false;
function startOpening(){
const op=$('#opening'),gm=$('#game');openingOn=true;gm.classList.add('opening');
hero.state='hidden';hero.x=HOME[0];hero.y=HOME[1];
zoom=1;view.s=view.base;cam.x=WORLD_W/2;cam.y=WORLD/2;clampCam();
op.hidden=false;op.classList.remove('bye');
const oc=op.querySelector('.ocat'),og=oc.getContext('2d'),pr=CAT_PT[0];og.imageSmoothingQuality='high';if(IMG.catpt)og.drawImage(IMG.catpt,pr[0],pr[1],pr[2],pr[2]*.84,0,0,140,118);
const T0=[];let skipped=false;const at=(ms,f)=>T0.push(setTimeout(f,ms));
at(850,()=>{tone(180,120,.12,.2,'triangle');sPop()}); // 쿵!
at(1000,()=>{tone(523,523,.25,.06,'triangle');tone(784,784,.35,.05,'triangle',.08)});
const next=()=>{if(skipped)return;skipped=true;T0.forEach(clearTimeout);
op.classList.add('bye');setTimeout(()=>{op.hidden=true;openingOn=false;gm.classList.remove('opening')},600);
// 가게 쪽으로 클로즈업 (주인공이 설 자리가 초상화·대사창에 가리지 않게)
const z=Math.min(ZMAX,2),s=view.base*z;
flyTo(HOME[0]-(view.W*(view.W<600?.8:.68)-view.W/2)/s,HOME[1]-(view.H*.4-view.H/2)/s,z,1.8,()=>{ // 다 다가가면 화면 오른쪽 밖에서 걸어 들어오기
hero.x=(view.W-view.ox)/view.s+60;hero.y=HOME[1];hero.state='enter';
hero.onArrive=()=>setTimeout(startStory,500)})};
at(3200,next);op.onclick=()=>{audio();next()}; // 누르면 바로 넘어감
}
function startStory(){
const lines=['와앗~!! 어서 와요!!','연락은 받은 지 이미 오래돼서, 오시기만을 손꼽아 기다리고 있었어요!','이 가게를 도와주신다고 하셨다면서요? 정말 고마워요~!',
'앗, 잠깐만요! 곧 고양이 손님들이 찾아오실 거예요!','고양이 손님들이 오시기 전에 가게를 준비해야 해요. 재료도 모으고, 물건도 만들고, 좋아하실 만한 상품도 준비해야 하거든요!',
'재료는 제가 섬을 한 바퀴씩 돌면서 조개·해초·유목을 모아 올게요. 모인 재료로 상품을 만들어 진열대에 놓아 주세요!','걱정 마세요! 제가 하나씩 알려드릴게요. 그럼 우리 같이 시작해 볼까요?'];
const st=$('#story'),p=st.querySelector('.txt'),btn=st.querySelector('.btn');let i=0;
st.querySelector('.pt').replaceWith(Object.assign(heroPortrait(560),{className:'pt'}));
$('#game').classList.add('storymode');st.hidden=false;
// 대사창 높이를 재서 초상화를 그 위에 세움 (화면 크기 바뀔 때도)
const fit=()=>{if(!st.hidden){const b=st.querySelector('.sbox');st.style.setProperty('--bh',(b.offsetHeight+parseFloat(getComputedStyle(b).bottom))+'px')}};
// 초상화·대사창에 가리지 않게 주인공이 화면 오른쪽 위쪽에 보이도록 카메라 이동
// 이야기 동안은 주인공을 크게 확대해서 보여줌
zoom=Math.min(ZMAX,2);view.s=view.base*zoom;
const aim=()=>{if(S.intro)return;cam.x=hero.x-(view.W*(view.W<600?.8:.68)-view.W/2)/view.s;cam.y=hero.y-(view.H*.4-view.H/2)/view.s;clampCam()};aim();
addEventListener('resize',fit);addEventListener('resize',aim);
const show=()=>{typeText(p,lines[i]);btn.textContent=i<lines.length-1?'다음 ▶':'시작하기';fit()};show();
st.querySelector('.sbox').onclick=()=>{
if(i>=lines.length)return; // 이미 끝남 (사라지는 중에 또 누른 경우)
if(p._t&&p.textContent.length<lines[i].length){clearInterval(p._t);p.textContent=lines[i];return} // 글자가 나오는 중이면 한 번에 다 보여 줌
audio();sPop();i++;if(i<lines.length){show();return}
st.classList.add('out');setTimeout(()=>{st.hidden=true;st.classList.remove('out')},350);$('#game').classList.remove('storymode');
S.intro=true;spawnT=3;hero.state='walk';hero.emote=HERO_ANIM.happy[1];hero.emoteT=.8;save();uiDirty=true; // 시작! → 자동 채집 출발
flyTo(ISLAND.x,ISLAND.y,islandZoom(),1.8); // 섬 전체가 보이게 쭉 축소
};
}
// 인터넷에 올렸을 때(https): 오프라인에서도 열리게 파일 저장 (안드로이드 앱 안에서는 필요 없음)
if('serviceWorker' in navigator&&location.protocol==='https:'&&location.hostname!=='catisland.example')navigator.serviceWorker.register('sw.js').catch(()=>{});
// 아이폰 Safari: 두 손가락 확대가 화면 전체 확대로 새지 않게
document.addEventListener('gesturestart',e=>e.preventDefault());
// 끌 때 남은 제작 시간 기억
function remember(){if(S.crafting[0])S.crafting[0].left=Math.max(0,S.crafting[0].end-now());save()}
addEventListener('pagehide',remember);document.addEventListener('visibilitychange',()=>{if(AC){if(document.hidden){AC.suspend();bgmEl.pause()}else{AC.resume();startBgm()}}if(document.hidden)remember();else if(S.crafting[0]&&S.crafting[0].left!=null){S.crafting[0].end=now()+S.crafting[0].left;S.crafting[0].left=null}});
</script>
